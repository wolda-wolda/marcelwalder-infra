# Global HTTP-context rate limits, scanner detection, and geo mappings for marcelwalder.eu (server_tokens off is set in /etc/nginx/nginx.conf)

limit_req_zone $binary_remote_addr zone=marcel_http:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=marcel_conn:10m;

limit_req_status 429;
limit_conn_status 429;

# Flag common automated vulnerability scanners by User-Agent
map $http_user_agent $is_bad_scanner {
    default 0;
    ~*(?:sqlmap|nikto|nmap|masscan|nuclei|gobuster|dirbuster|wpscan|acunetix|nessus|zgrab|zmeu|morfeus|jaeles|feroxbuster|ffuf|httpx) 1;
}

# Sanctioned-country CIDR list (populated atomically by marcelwalder-geoblock-update)
geo $is_blocked_country {
    default 0;
    include /etc/nginx/geo/blocked-countries.inc;
}

# Preserve Let's Encrypt ACME HTTP-01 validation even for blocked geo entries
map "$is_blocked_country:$request_uri" $drop_blocked_country {
    ~^1:/\.well-known/acme-challenge/ 0;
    ~^1: 1;
    default 0;
}

# Shared WebSocket Upgrade mapping for reverse-proxied virtual hosts
map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}
