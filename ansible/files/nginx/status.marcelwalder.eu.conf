server {
    listen 80;
    listen [::]:80;
    server_name status.marcelwalder.eu;

    server_tokens off;

    if ($drop_blocked_country) {
        return 444;
    }

    if ($is_bad_scanner) {
        return 444;
    }

    location /.well-known/acme-challenge/ {
        root /var/www/certbot-status;
        try_files $uri =404;
    }

    location / {
        return 301 https://status.marcelwalder.eu$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name status.marcelwalder.eu;

    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/status.marcelwalder.eu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/status.marcelwalder.eu/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    if ($drop_blocked_country) {
        return 444;
    }

    if ($is_bad_scanner) {
        return 444;
    }

    limit_req zone=marcel_http burst=60 nodelay;
    limit_conn marcel_conn 30;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Drop dotfile probes immediately while preserving /.well-known/
    location ~ /\.(?!well-known) {
        return 444;
    }

    # Public read-only status page (/status/prod) and its required static/API endpoints only
    location ~ ^/(?:$|status/prod(?:/.*)?$|api/status-page/|api/entry-page$|assets/|upload/|icon(?:-[0-9]+x[0-9]+)?\.(?:svg|png)$|apple-touch-icon\.png$|favicon\.ico$|manifest\.json$|serviceWorker\.js$|robots\.txt$) {
        if ($request_method !~ ^(GET|HEAD|OPTIONS)$) {
            return 405;
        }
        include /etc/nginx/snippets/marcelwalder-uptime-kuma-proxy.conf;
    }

    # Restrict Uptime Kuma admin UI (/dashboard, /setup, /settings, /socket.io/, /metrics, other /api/*) to WireGuard only
    location / {
        allow 10.66.66.0/24;
        allow 127.0.0.1;
        deny all;

        include /etc/nginx/snippets/marcelwalder-uptime-kuma-proxy.conf;
    }
}
