server {
    server_name marcelwalder.eu www.marcelwalder.eu;

    root /var/www/marcelwalder.eu;
    index index.html;

    server_tokens off;
    include /etc/nginx/snippets/marcelwalder-security-headers.conf;
    include /etc/nginx/snippets/marcelwalder-bot-protection.conf;

    if ($host = www.marcelwalder.eu) {
        return 301 https://marcelwalder.eu$request_uri;
    }

    location /.well-known/acme-challenge/ {
        try_files $uri =404;
    }

    location ~* \.(?:woff2|png|svg)$ {
        include /etc/nginx/snippets/marcelwalder-security-headers.conf;
        add_header Cache-Control "public, max-age=604800" always;
        try_files $uri =404;
    }

    location ~* \.(?:css|js)$ {
        include /etc/nginx/snippets/marcelwalder-security-headers.conf;
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/snippets/marcelwalder-security-headers.conf;
        add_header Cache-Control "public, max-age=300" always;
        try_files $uri $uri/ =404;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/marcelwalder.eu/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/marcelwalder.eu/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = www.marcelwalder.eu) {
        return 301 https://marcelwalder.eu$request_uri;
    }

    if ($host = marcelwalder.eu) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name marcelwalder.eu www.marcelwalder.eu;
    return 404; # managed by Certbot
}
