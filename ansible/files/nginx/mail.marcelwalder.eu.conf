server {
    listen 80;
    listen [::]:80;
    server_name mail.marcelwalder.eu;

    server_tokens off;

    if ($drop_blocked_country) {
        return 444;
    }

    if ($is_bad_scanner) {
        return 444;
    }

    location /.well-known/acme-challenge/ {
        root /var/www/mail;
        try_files $uri =404;
    }

    location / {
        return 301 https://mail.marcelwalder.eu$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name mail.marcelwalder.eu;

    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/mail.marcelwalder.eu-0001/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mail.marcelwalder.eu-0001/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 50M;

    if ($drop_blocked_country) {
        return 444;
    }

    if ($is_bad_scanner) {
        return 444;
    }

    limit_req zone=marcel_http burst=60 nodelay;
    limit_conn marcel_conn 30;

    proxy_hide_header X-Content-Type-Options;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Drop dotfile probes immediately while preserving /.well-known/
    location ~ /\.(?!well-known) {
        return 444;
    }

    location /.well-known/acme-challenge/ {
        root /var/www/mail;
        try_files $uri =404;
    }

    location ~ ^/(avatar|concept[1-9])\.svg$ {
        root /var/www/mail;
        default_type image/svg+xml;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=604800, immutable";
        add_header Access-Control-Allow-Origin "*";
    }

    location / {
        # Block public access to SnappyMail admin panel query routes (?admin / ?/Admin...)
        if ($args ~* "(?:^|&)(?:admin(?==|&|$)|/Admin)") {
            return 403;
        }

        proxy_pass http://127.0.0.1:8888;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
