# Internal-only admin analytics & telemetry endpoint (localhost + WireGuard wg0 only)
server {
    listen 127.0.0.1:8085;
    listen 10.66.66.1:8085;
    listen 10.66.66.1:80;
    server_name analytics.marcelwalder.eu _;

    server_tokens off;
    access_log off;

    allow 10.66.66.0/24;
    allow 127.0.0.1;
    deny all;

    location = /metrics {
        proxy_pass http://127.0.0.1:9100/metrics;
        proxy_set_header Host $host;
    }

    location / {
        root /var/www/internal/goaccess;
        index index.html;
        try_files $uri $uri/ =404;
    }
}

# Internal-only Uptime Kuma admin UI (localhost + WireGuard wg0 only)
server {
    listen 127.0.0.1:8086;
    listen 10.66.66.1:8086;
    listen 10.66.66.1:80;
    server_name kuma.marcelwalder.eu status.marcelwalder.eu;

    server_tokens off;
    access_log off;

    allow 10.66.66.0/24;
    allow 127.0.0.1;
    deny all;

    location / {
        include /etc/nginx/snippets/marcelwalder-uptime-kuma-proxy.conf;
    }
}
