# Scoped to marcelwalder.eu (leaves mail/mta-sts vhosts untouched)
# Server-context rate limiting, method restriction, and exploit-probe filtering
limit_req zone=marcel_http burst=30 nodelay;
limit_conn marcel_conn 20;

if ($is_bad_scanner) {
    return 444;
}

# Static site serves GET/HEAD/OPTIONS only
if ($request_method !~ ^(GET|HEAD|OPTIONS)$) {
    return 405;
}

# Preserve /.well-known/ (ACME HTTP-01, security.txt) while dropping all other dotfiles
location ~ /\.(?!well-known) {
    return 444;
}

# Drop common CMS, PHP, CGI, and backup/archive probe paths immediately
location ~* ^/(?:wp-admin|wp-login|wp-content|wp-includes|xmlrpc\.php|phpmyadmin|pma|cgi-bin|vendor|actuator)(?:/|$) {
    return 444;
}

location ~* \.(?:php|phtml|asp|aspx|jsp|cgi|pl|py|sh|sql|bak|old|orig|swp|tar|gz|zip|7z|rar|env|git|hg|svn)$ {
    return 444;
}
