server {
    listen 80;
    listen [::]:80;
    server_name mta-sts.marcelwalder.eu;

    server_tokens off;

    if ($drop_blocked_country) {
        return 444;
    }

    if ($is_bad_scanner) {
        return 444;
    }

    location /.well-known/acme-challenge/ {
        root /var/www/mta-sts;
        try_files $uri =404;
    }

    location / {
        return 301 https://mta-sts.marcelwalder.eu$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name mta-sts.marcelwalder.eu;

    server_tokens off;
    root /var/www/mta-sts;

    ssl_certificate /etc/letsencrypt/live/mta-sts.marcelwalder.eu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mta-sts.marcelwalder.eu/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    if ($drop_blocked_country) {
        return 444;
    }

    if ($is_bad_scanner) {
        return 444;
    }

    limit_req zone=marcel_http burst=30 nodelay;
    limit_conn marcel_conn 20;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location ~ /\.(?!well-known) {
        return 444;
    }

    location /.well-known/acme-challenge/ {
        try_files $uri =404;
    }

    location = /.well-known/mta-sts.txt {
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 404;
    }
}
