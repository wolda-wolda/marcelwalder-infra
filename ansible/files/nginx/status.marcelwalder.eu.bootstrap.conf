server {
    listen 80;
    listen [::]:80;
    server_name status.marcelwalder.eu;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot-status;
        try_files $uri =404;
    }

    location / {
        return 200 "status.marcelwalder.eu ACME bootstrap\n";
        add_header Content-Type text/plain;
    }
}
