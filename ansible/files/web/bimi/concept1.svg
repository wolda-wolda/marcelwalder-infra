<?xml version="1.0" encoding="utf-8"?>
<svg version="1.2" baseProfile="tiny-ps" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Marcel Walder - Tech Ribbon Monogram</title>
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="glow1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
    <linearGradient id="ribbon1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="35%" stop-color="#0EA5E9"/>
      <stop offset="70%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <circle cx="256" cy="256" r="248" fill="url(#bg1)"/>
  <circle cx="256" cy="256" r="240" fill="none" stroke="url(#glow1)" stroke-width="4" opacity="0.4"/>
  <circle cx="256" cy="256" r="226" fill="none" stroke="#334155" stroke-width="1.5" opacity="0.5"/>

  <!-- M-W Integrated Dynamic Vector Ribbon -->
  <path d="M 125 355 L 125 165 L 205 305 L 256 220 L 307 305 L 387 165 L 387 355" 
        fill="none" 
        stroke="url(#ribbon1)" 
        stroke-width="44" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>

  <!-- Lower W Underlay Accent -->
  <path d="M 175 355 L 256 240 L 337 355" 
        fill="none" 
        stroke="url(#glow1)" 
        stroke-width="20" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        opacity="0.8"/>
  
  <!-- Central Focus Node -->
  <circle cx="256" cy="235" r="12" fill="#38BDF8"/>
</svg>
