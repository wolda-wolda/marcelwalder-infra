services:
  snappymail:
    image: djmaze/snappymail:v3.0.1.2@sha256:e2fa8e4f348905831f95826bf6c0711e15f85aec2bab3e96ffca0dd45b2e8aed
    container_name: snappymail
    restart: always
    ports:
      - "127.0.0.1:8888:8888"
    volumes:
      - /opt/snappymail/volume:/var/lib/snappymail
    mem_limit: 256m
    pids_limit: 128
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
