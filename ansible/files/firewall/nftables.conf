#!/usr/sbin/nft -f
# Host IPv4 + IPv6 firewall managed by Ansible (preserves Docker iptables-nft chains and marcelwalder_geoblock)

table inet marcelwalder_host
delete table inet marcelwalder_host

table inet marcelwalder_host {
    chain input {
        type filter hook input priority filter; policy drop;
        ct state established,related accept
        ct state invalid drop
        iifname "lo" accept
        ip protocol icmp accept
        ip6 nexthdr ipv6-icmp accept
        tcp dport { 22, 25, 80, 443, 465, 587, 993 } accept
        udp dport 51820 accept
        iifname "wg0" ip saddr 10.66.66.0/24 accept
    }

    chain output {
        type filter hook output priority filter; policy accept;
        ip daddr 169.254.0.0/16 jump instance_services
    }

    chain instance_services {
        ip daddr 169.254.0.2 meta skuid 0 tcp dport 3260 accept
        ip daddr 169.254.2.0/24 meta skuid 0 tcp dport 3260 accept
        ip daddr 169.254.4.0/24 meta skuid 0 tcp dport 3260 accept
        ip daddr 169.254.5.0/24 meta skuid 0 tcp dport 3260 accept
        ip daddr 169.254.0.2 tcp dport 80 accept
        ip daddr 169.254.0.3 meta skuid 0 tcp dport 80 accept
        ip daddr 169.254.0.4 tcp dport 80 accept
        ip daddr 169.254.169.254 udp dport { 53, 67, 69, 123 } accept
        ip daddr 169.254.169.254 tcp dport { 53, 80 } accept
        ip daddr 169.254.0.0/16 ip protocol tcp reject with tcp reset
        ip daddr 169.254.0.0/16 ip protocol udp reject with icmp type port-unreachable
    }
}
