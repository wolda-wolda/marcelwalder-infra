---
- name: Baseline hardening for newly provisioned Ubuntu OCI VMs
  hosts: "{{ target_hosts | default('none') }}"
  become: true

  vars:
    oci_s3_access_key_id: "{{ lookup('env', 'OCI_S3_ACCESS_KEY_ID') }}"
    oci_s3_secret_access_key: "{{ lookup('env', 'OCI_S3_SECRET_ACCESS_KEY') }}"
    restic_password: "{{ lookup('env', 'RESTIC_PASSWORD') }}"
    wg_client_public_key: "{{ lookup('env', 'WG_CLIENT_PUBLIC_KEY') }}"

  tasks:
    - name: Verify required backup and WireGuard environment secrets are supplied
      ansible.builtin.assert:
        that:
          - oci_s3_access_key_id | length > 0
          - oci_s3_secret_access_key | length > 0
          - restic_password | length > 0
          - wg_client_public_key | length > 0
        fail_msg: "Missing OCI_S3_*, RESTIC_PASSWORD, or WG_CLIENT_PUBLIC_KEY env vars."
        quiet: true
      no_log: true

    - name: Install baseline packages and unattended upgrades
      ansible.builtin.apt:
        name:
          - unattended-upgrades
          - ca-certificates
          - gnupg
          - fail2ban
          - python3-systemd
          - nftables
          - restic
          - goaccess
          - wireguard-tools
          - prometheus-node-exporter
          - curl
          - rsync
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Install official nginx.org signing key with fingerprint verification
      ansible.builtin.shell: |
        set -euo pipefail
        tmp_key="$(mktemp)"
        trap 'rm -f "$tmp_key"' EXIT
        curl -fsSL https://nginx.org/keys/nginx_signing.key | gpg --dearmor --yes -o "$tmp_key"
        gpg --show-keys --with-colons "$tmp_key" | grep -q "573BFD6B3D8FBC641079A6ABABF5BD827BD9BF62"
        install -m 0644 -o root -g root "$tmp_key" /usr/share/keyrings/nginx-archive-keyring.gpg
      args:
        executable: /bin/bash
        creates: /usr/share/keyrings/nginx-archive-keyring.gpg

    - name: Configure official nginx.org mainline APT repository
      ansible.builtin.copy:
        content: |
          deb [signed-by=/usr/share/keyrings/nginx-archive-keyring.gpg] https://nginx.org/packages/mainline/ubuntu noble nginx
        dest: /etc/apt/sources.list.d/nginx.list
        owner: root
        group: root
        mode: "0644"
      register: nginx_apt_repo

    - name: Pin nginx.org nginx package above Ubuntu repo package
      ansible.builtin.copy:
        content: |
          Package: nginx
          Pin: origin nginx.org
          Pin: release o=nginx
          Pin-Priority: 900
        dest: /etc/apt/preferences.d/99nginx
        owner: root
        group: root
        mode: "0644"
      register: nginx_apt_pin

    - name: Ensure Nginx is kept updated from official mainline repository
      ansible.builtin.apt:
        name: nginx
        state: latest
        update_cache: "{{ nginx_apt_repo.changed or nginx_apt_pin.changed }}"
        dpkg_options: "force-confdef,force-confold"
      register: nginx_pkg

    - name: Remove upstream nginx.org default HTTP vhost if added on upgrade
      ansible.builtin.file:
        path: /etc/nginx/conf.d/default.conf
        state: absent
      when: nginx_pkg.changed

    - name: Ensure Nginx cache directory and logrotate user match www-data
      ansible.builtin.file:
        path: /var/cache/nginx
        state: directory
        owner: www-data
        group: www-data
        mode: "0755"

    - name: Align nginx logrotate file creation ownership with www-data
      ansible.builtin.replace:
        path: /etc/logrotate.d/nginx
        regexp: 'create\s+\d+\s+nginx\s+adm'
        replace: 'create 640 www-data adm'
      when: nginx_pkg.changed

    - name: Enable unattended security updates
      ansible.builtin.service:
        name: unattended-upgrades
        enabled: true
        state: started

    - name: Install custom Fail2ban Nginx probe-drop filter
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../files/fail2ban/nginx-probe-drop.conf"
        dest: /etc/fail2ban/filter.d/nginx-probe-drop.conf
        owner: root
        group: root
        mode: "0644"
      notify: Validate and restart fail2ban

    - name: Install Fail2ban jail configuration
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../files/fail2ban/marcelwalder.local"
        dest: /etc/fail2ban/jail.d/marcelwalder.local
        owner: root
        group: root
        mode: "0644"
      notify: Validate and restart fail2ban

    - name: Ensure Fail2ban service is enabled and running
      ansible.builtin.service:
        name: fail2ban
        enabled: true
        state: started

    - name: Ensure geoblock configuration directory exists
      ansible.builtin.file:
        path: /etc/marcelwalder
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Install sanctioned-country list configuration
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../files/geoblock/geoblock.conf"
        dest: /etc/marcelwalder/geoblock.conf
        owner: root
        group: root
        mode: "0644"
      notify: Refresh geoblock rules

    - name: Install geoblock update script (nftables + Nginx geo)
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../files/geoblock/update-geoblock.sh"
        dest: /usr/local/sbin/marcelwalder-geoblock-update
        owner: root
        group: root
        mode: "0755"
      notify: Refresh geoblock rules

    - name: Install geoblock, GoAccess, and Restic systemd units and timers
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../files/systemd/{{ item }}"
        dest: "/etc/systemd/system/{{ item }}"
        owner: root
        group: root
        mode: "0644"
      loop:
        - marcelwalder-geoblock.service
        - marcelwalder-geoblock-update.service
        - marcelwalder-geoblock-update.timer
        - marcelwalder-goaccess.service
        - marcelwalder-goaccess.timer
        - marcelwalder-restic-backup.service
        - marcelwalder-restic-backup.timer
      notify: Reload systemd daemon

    - name: Flush handlers before enabling geoblock services
      ansible.builtin.meta: flush_handlers

    - name: Populate initial geoblock ruleset if missing
      ansible.builtin.command: /usr/local/sbin/marcelwalder-geoblock-update
      args:
        creates: /etc/marcelwalder/geoblock.nft

    - name: Enable geoblock boot service and weekly refresh timer
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        enabled: true
        state: started
      loop:
        - marcelwalder-geoblock.service
        - marcelwalder-geoblock-update.timer

    - name: Configure prometheus-node-exporter to bind localhost only
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../files/monitoring/prometheus-node-exporter.default"
        dest: /etc/default/prometheus-node-exporter
        owner: root
        group: root
        mode: "0644"
      notify: Restart node_exporter

    - name: Ensure prometheus-node-exporter is enabled and running
      ansible.builtin.systemd_service:
        name: prometheus-node-exporter
        enabled: true
        state: started

    - name: Ensure Docker daemon configuration directory exists
      ansible.builtin.file:
        path: /etc/docker
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Configure Docker daemon JSON log rotation
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../files/monitoring/docker-daemon.json"
        dest: /etc/docker/daemon.json
        owner: root
        group: root
        mode: "0644"
      register: docker_daemon_cfg

    - name: Restart Docker daemon to apply new log rotation defaults
      ansible.builtin.systemd_service:
        name: docker
        state: restarted
      when: docker_daemon_cfg.changed

    - name: Ensure existing mailserver and snappymail stacks adopt log rotation once
      ansible.builtin.shell: |
        set -euo pipefail
        for stack in mailserver snappymail; do
          dir="/opt/${stack}"
          if [ -f "${dir}/docker-compose.yml" ] && docker inspect "$stack" >/dev/null 2>&1; then
            cfg="$(docker inspect --format '{% raw %}{{json .HostConfig.LogConfig.Config}}{% endraw %}' "$stack")"
            if [ "$cfg" = "{}" ] || [ "$cfg" = "null" ]; then
              docker compose -f "${dir}/docker-compose.yml" up -d --force-recreate
            fi
          fi
        done
      args:
        executable: /bin/bash
      changed_when: false

    - name: Ensure Uptime Kuma directories exist
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        owner: root
        group: root
        mode: "{{ item.mode }}"
      loop:
        - { path: /opt/uptime-kuma, mode: "0755" }
        - { path: /opt/uptime-kuma/data, mode: "0700" }

    - name: Install Uptime Kuma Docker Compose manifest
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../files/monitoring/uptime-kuma-compose.yml"
        dest: /opt/uptime-kuma/compose.yml
        owner: root
        group: root
        mode: "0644"
      register: uptime_kuma_compose

    - name: Back up data and stop Uptime Kuma before image upgrade
      ansible.builtin.shell: |
        install -d -m 0700 /var/backups
        tar -czf /var/backups/uptime-kuma-pre-upgrade.tar.gz -C /opt/uptime-kuma data
        docker compose -f /opt/uptime-kuma/compose.yml down
        docker compose -f /opt/uptime-kuma/compose.yml pull
      args:
        executable: /bin/bash
      when: uptime_kuma_compose.changed

    - name: Ensure Uptime Kuma container is running
      ansible.builtin.command: docker compose -f /opt/uptime-kuma/compose.yml up -d --remove-orphans
      register: uptime_kuma_up
      changed_when: >-
        'Started' in uptime_kuma_up.stderr
        or 'Created' in uptime_kuma_up.stderr
        or 'Recreated' in uptime_kuma_up.stderr

    - name: Wait for Uptime Kuma HTTP backend on localhost:3001
      ansible.builtin.uri:
        url: http://127.0.0.1:3001/
        status_code: [200, 302]
        follow_redirects: none
      register: kuma_health
      retries: 20
      delay: 5
      until: kuma_health.status is defined and kuma_health.status in [200, 302]

    - name: Remove temporary unencrypted Uptime Kuma pre-upgrade archive
      ansible.builtin.file:
        path: /var/backups/uptime-kuma-pre-upgrade.tar.gz
        state: absent

    - name: Ensure mailserver and SnappyMail directories exist
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        owner: root
        group: root
        mode: "{{ item.mode }}"
      loop:
        - { path: /opt/mailserver, mode: "0755" }
        - { path: /opt/mailserver/config, mode: "0750" }
        - { path: /opt/snappymail, mode: "0755" }

    - name: Install Docker-Mailserver Compose manifest
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../files/mailserver/docker-compose.yml"
        dest: /opt/mailserver/docker-compose.yml
        owner: root
        group: root
        mode: "0644"

    - name: Install Docker-Mailserver environment configuration
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../files/mailserver/mailserver.env"
        dest: /opt/mailserver/mailserver.env
        owner: root
        group: root
        mode: "0600"

    - name: Install non-secret Docker-Mailserver config files
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../files/mailserver/{{ item }}"
        dest: "/opt/mailserver/config/{{ item }}"
        owner: root
        group: root
        mode: "0640"
      loop:
        - before.dovecot.sieve
        - postfix-virtual.cf

    - name: Ensure placeholder Docker-Mailserver config files exist if missing
      ansible.builtin.copy:
        content: ""
        dest: "/opt/mailserver/config/{{ item }}"
        owner: root
        group: root
        mode: "0640"
        force: false
      loop:
        - dovecot-quotas.cf
        - postfix-main.cf

    - name: Enforce restrictive permissions on placeholder Docker-Mailserver config files
      ansible.builtin.file:
        path: "/opt/mailserver/config/{{ item }}"
        state: file
        owner: root
        group: root
        mode: "0640"
      loop:
        - dovecot-quotas.cf
        - postfix-main.cf

    - name: Check secret Docker-Mailserver config files
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - /opt/mailserver/config/postfix-accounts.cf
        - /opt/mailserver/config/postfix-sasl-password.cf
      register: mailserver_secret_files

    - name: Restrict secret Docker-Mailserver config file permissions
      ansible.builtin.file:
        path: "{{ item.item }}"
        owner: root
        group: root
        mode: "0600"
      loop: "{{ mailserver_secret_files.results }}"
      when: item.stat.exists

    - name: Install SnappyMail Docker Compose manifest
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../files/mailserver/snappymail-compose.yml"
        dest: /opt/snappymail/docker-compose.yml
        owner: root
        group: root
        mode: "0644"

    - name: Ensure Let's Encrypt deploy renewal hooks directory exists
      ansible.builtin.file:
        path: /etc/letsencrypt/renewal-hooks/deploy
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Install Let's Encrypt deploy hook to reload Nginx and restart mailserver
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../files/maintenance/reload-mailserver.sh"
        dest: /etc/letsencrypt/renewal-hooks/deploy/reload-mailserver.sh
        owner: root
        group: root
        mode: "0755"

    - name: Install hardened mail-avatar BIMI CLI utility
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../files/maintenance/mail-avatar.py"
        dest: /usr/local/bin/mail-avatar
        owner: root
        group: root
        mode: "0755"

    - name: Ensure local /backup directory exists with strict root-only permissions
      ansible.builtin.file:
        path: /backup
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: Check whether SnappyMail configuration exists
      ansible.builtin.stat:
        path: /opt/snappymail/volume/_data_/_default_/configs/application.ini
      register: snappymail_ini

    - name: Keep SnappyMail web admin panel disabled by default
      ansible.builtin.lineinfile:
        path: /opt/snappymail/volume/_data_/_default_/configs/application.ini
        regexp: '^\s*allow_admin_panel\s*='
        line: "allow_admin_panel = Off"
      when: snappymail_ini.stat.exists

    - name: Ensure SnappyMail container runs patched internal Nginx binary in memory
      ansible.builtin.shell: |
        set -euo pipefail
        if docker inspect snappymail >/dev/null 2>&1; then
          docker exec snappymail sh -c 'apk update -q && apk upgrade --no-cache -q nginx libpq libecpg'
          if docker exec snappymail sh -c 'ls -l /proc/$(cat /tmp/nginx.pid)/exe' 2>/dev/null | grep -q '(deleted)'; then
            docker restart snappymail
          fi
        fi
      args:
        executable: /bin/bash
      changed_when: false

    - name: Install GoAccess static report update script
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../files/monitoring/goaccess-update.sh"
        dest: /usr/local/sbin/marcelwalder-goaccess-update
        owner: root
        group: root
        mode: "0755"
      notify: Refresh GoAccess report

    - name: Generate initial GoAccess report if only placeholder exists
      ansible.builtin.shell: |
        if ! grep -q "goaccess" /var/www/internal/goaccess/index.html 2>/dev/null; then
            /usr/local/sbin/marcelwalder-goaccess-update
        fi
      args:
        executable: /bin/bash
      changed_when: false

    - name: Enable and start GoAccess analytics timer
      ansible.builtin.systemd_service:
        name: marcelwalder-goaccess.timer
        enabled: true
        state: started

    - name: Install Restic S3 credentials and passphrase environment file
      ansible.builtin.copy:
        content: |
          AWS_ACCESS_KEY_ID={{ oci_s3_access_key_id }}
          AWS_SECRET_ACCESS_KEY={{ oci_s3_secret_access_key }}
          AWS_DEFAULT_REGION=eu-frankfurt-1
          RESTIC_REPOSITORY=s3:https://frlsvddoxbrh.compat.objectstorage.eu-frankfurt-1.oraclecloud.com/backups-marcelwalder-prod
          RESTIC_PASSWORD={{ restic_password }}
        dest: /etc/marcelwalder/restic.env
        owner: root
        group: root
        mode: "0600"
      no_log: true

    - name: Install Restic encrypted offsite backup script
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../files/backup/restic-backup.sh"
        dest: /usr/local/sbin/marcelwalder-restic-backup
        owner: root
        group: root
        mode: "0755"

    - name: Enable and start daily Restic offsite backup timer
      ansible.builtin.systemd_service:
        name: marcelwalder-restic-backup.timer
        enabled: true
        state: started

    - name: Initialize Restic repository and run first encrypted offsite backup
      ansible.builtin.shell: /usr/local/sbin/marcelwalder-restic-backup && touch /etc/marcelwalder/.restic-bootstrapped
      args:
        executable: /bin/bash
        creates: /etc/marcelwalder/.restic-bootstrapped

    - name: Ensure WireGuard directory exists with restricted permissions
      ansible.builtin.file:
        path: /etc/wireguard
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: Generate WireGuard server keypair if missing
      ansible.builtin.shell: |
        umask 077
        wg genkey | tee /etc/wireguard/server.key | wg pubkey > /etc/wireguard/server.pub
      args:
        executable: /bin/bash
        creates: /etc/wireguard/server.key

    - name: Read WireGuard server private key
      ansible.builtin.slurp:
        src: /etc/wireguard/server.key
      register: wg_server_key_raw
      no_log: true

    - name: Configure WireGuard wg0 admin mesh interface
      ansible.builtin.copy:
        content: |
          [Interface]
          Address = 10.66.66.1/24
          ListenPort = 51820
          PrivateKey = {{ wg_server_key_raw.content | b64decode | trim }}

          [Peer]
          # Admin peer (laptop/workstation)
          PublicKey = {{ wg_client_public_key }}
          AllowedIPs = 10.66.66.2/32
        dest: /etc/wireguard/wg0.conf
        owner: root
        group: root
        mode: "0600"
      no_log: true
      notify: Restart wg-quick@wg0

    - name: Persist mail/web TCP ports, WireGuard UDP 51820, and wg0 rules in /etc/iptables/rules.v4
      ansible.builtin.lineinfile:
        path: /etc/iptables/rules.v4
        insertbefore: "^-A INPUT -j REJECT"
        line: "{{ item }}"
      loop:
        - "-A INPUT -p tcp -m multiport --dports 25,80,443,465,587,993 -j ACCEPT"
        - "-A INPUT -p udp -m udp --dport 51820 -j ACCEPT"
        - "-A INPUT -i wg0 -s 10.66.66.0/24 -j ACCEPT"

    - name: Ensure live iptables INPUT chain permits mail/web TCP ports, WireGuard UDP 51820, and wg0 before REJECT
      ansible.builtin.shell: |
        set -euo pipefail
        ensure_rule() {
          local -a rule=("$@")
          if ! iptables -C INPUT "${rule[@]}" 2>/dev/null; then
            local reject_line
            reject_line="$(iptables -L INPUT --line-numbers | awk '/REJECT/ {print $1; exit}')"
            iptables -I INPUT "${reject_line:-1}" "${rule[@]}"
          fi
        }
        ensure_rule -p tcp -m multiport --dports 25,80,443,465,587,993 -j ACCEPT
        ensure_rule -p udp -m udp --dport 51820 -j ACCEPT
        ensure_rule -i wg0 -s 10.66.66.0/24 -j ACCEPT
      args:
        executable: /bin/bash
      changed_when: false

    - name: Ensure /etc/iptables directory exists
      ansible.builtin.file:
        path: /etc/iptables
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Install IPv6 iptables baseline policy
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../files/firewall/rules.v6"
        dest: /etc/iptables/rules.v6
        owner: root
        group: root
        mode: "0644"
      register: ip6tables_rules

    - name: Apply IPv6 INPUT firewall rules without flushing live Docker FORWARD chains
      ansible.builtin.shell: |
        set -euo pipefail
        ip6tables-restore --test < /etc/iptables/rules.v6
        ip6tables -F INPUT
        ip6tables -A INPUT -m state --state RELATED,ESTABLISHED -j ACCEPT
        ip6tables -A INPUT -i lo -j ACCEPT
        ip6tables -A INPUT -p ipv6-icmp -j ACCEPT
        ip6tables -A INPUT -p tcp -m multiport --dports 22,25,80,443,465,587,993 -j ACCEPT
        ip6tables -A INPUT -p udp -m udp --dport 51820 -j ACCEPT
        ip6tables -A INPUT -j REJECT --reject-with icmp6-adm-prohibited
      args:
        executable: /bin/bash
      when: ip6tables_rules.changed

    - name: Ensure WireGuard wg-quick@wg0 service is enabled and running
      ansible.builtin.systemd_service:
        name: wg-quick@wg0
        enabled: true
        state: started

    - name: Install adapted weekly automated stack patching script
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../files/maintenance/mailserver-update.sh"
        dest: /opt/mailserver-update.sh
        owner: root
        group: root
        mode: "0755"

    - name: Ensure /usr/local/bin convenience symlinks exist
      ansible.builtin.file:
        src: "{{ item.src }}"
        dest: "{{ item.dest }}"
        state: link
      loop:
        - { src: /opt/mailserver-update.sh, dest: /usr/local/bin/mailserver-update }
        - { src: /opt/mailserver-backup.sh, dest: /usr/local/bin/mailserver-backup }

    - name: Install weekly automated patching cron schedule
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../files/maintenance/mailserver-update.cron"
        dest: /etc/cron.d/mailserver-update
        owner: root
        group: root
        mode: "0644"

    - name: Install logrotate policy for mailserver-update.log
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../files/maintenance/mailserver-update.logrotate"
        dest: /etc/logrotate.d/mailserver-update
        owner: root
        group: root
        mode: "0644"

    - name: Install hardened quota-watchdog script as root-owned
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../files/maintenance/quota-watchdog.sh"
        dest: /opt/quota-watchdog.sh
        owner: root
        group: root
        mode: "0755"

    - name: Install quota-watchdog hourly cron schedule
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../files/maintenance/quota-watchdog.cron"
        dest: /etc/cron.d/quota-watchdog
        owner: root
        group: root
        mode: "0644"

    - name: Install hardened local mailserver backup script
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../files/maintenance/mailserver-backup.sh"
        dest: /opt/mailserver-backup.sh
        owner: root
        group: root
        mode: "0755"

    - name: Install local mailserver backup cron schedule
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../files/maintenance/mailserver-backup.cron"
        dest: /etc/cron.d/mailserver-backup
        owner: root
        group: root
        mode: "0644"

    - name: Install hardened OpenSSH drop-in configuration
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../files/ssh/50-marcelwalder-hardening.conf"
        dest: /etc/ssh/sshd_config.d/50-marcelwalder-hardening.conf
        owner: root
        group: root
        mode: "0644"
      notify: Validate and restart sshd

    - name: Disable SSH password authentication in main sshd_config
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: "^#?PasswordAuthentication"
        line: "PasswordAuthentication no"
      notify: Validate and restart sshd

    - name: Remove duplicate quota-watchdog entry from root user crontab
      ansible.builtin.shell: |
        set -euo pipefail
        if crontab -u root -l 2>/dev/null | grep -qF '/opt/quota-watchdog.sh'; then
          remaining="$(crontab -u root -l 2>/dev/null | grep -vF '/opt/quota-watchdog.sh' | grep -v '^#' | sed '/^[[:space:]]*$/d' || true)"
          if [ -z "$remaining" ]; then
            crontab -u root -r
          else
            crontab -u root -l 2>/dev/null | grep -vF '/opt/quota-watchdog.sh' | crontab -u root -
          fi
          echo "REMOVED"
        fi
      args:
        executable: /bin/bash
      register: root_crontab_dedup
      changed_when: "'REMOVED' in root_crontab_dedup.stdout"

    - name: Remove legacy standalone Certbot helper script
      ansible.builtin.file:
        path: /opt/get-ssl.sh
        state: absent

    - name: Stop and mask unused rpcbind services
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        enabled: false
        masked: true
        state: stopped
      loop:
        - rpcbind.socket
        - rpcbind.service
      failed_when: false

  handlers:
    - name: Run fail2ban config test
      listen: "Validate and restart fail2ban"
      ansible.builtin.command: fail2ban-client -t
      changed_when: false

    - name: Restart fail2ban service
      listen: "Validate and restart fail2ban"
      ansible.builtin.service:
        name: fail2ban
        state: restarted

    - name: Reload systemd daemon
      ansible.builtin.systemd_service:
        daemon_reload: true

    - name: Refresh geoblock rules
      ansible.builtin.command: /usr/local/sbin/marcelwalder-geoblock-update
      changed_when: true

    - name: Restart node_exporter
      ansible.builtin.service:
        name: prometheus-node-exporter
        state: restarted

    - name: Refresh GoAccess report
      ansible.builtin.command: /usr/local/sbin/marcelwalder-goaccess-update
      changed_when: true

    - name: Restart wg-quick@wg0
      ansible.builtin.service:
        name: wg-quick@wg0
        state: restarted

    - name: Run sshd config test
      listen: "Validate and restart sshd"
      ansible.builtin.command: sshd -t
      changed_when: false

    - name: Restart sshd service
      listen: "Validate and restart sshd"
      ansible.builtin.service:
        name: ssh
        state: restarted
