---
- name: Baseline hardening for newly provisioned Ubuntu OCI VMs
  hosts: "{{ target_hosts | default('none') }}"
  become: true

  vars:
    oci_s3_access_key_id: "{{ lookup('env', 'OCI_S3_ACCESS_KEY_ID') }}"
    oci_s3_secret_access_key: "{{ lookup('env', 'OCI_S3_SECRET_ACCESS_KEY') }}"
    restic_password: "{{ lookup('env', 'RESTIC_PASSWORD') }}"
    wg_client_public_key: "{{ lookup('env', 'WG_CLIENT_PUBLIC_KEY') }}"

  tasks:
    - name: Verify required backup and WireGuard environment secrets are supplied
      ansible.builtin.assert:
        that:
          - oci_s3_access_key_id | length > 0
          - oci_s3_secret_access_key | length > 0
          - restic_password | length > 0
          - wg_client_public_key | length > 0
        fail_msg: "Missing OCI_S3_*, RESTIC_PASSWORD, or WG_CLIENT_PUBLIC_KEY env vars."
        quiet: true
      no_log: true

    - name: Install baseline packages and unattended upgrades
      ansible.builtin.apt:
        name:
          - unattended-upgrades
          - fail2ban
          - python3-systemd
          - nftables
          - restic
          - goaccess
          - wireguard-tools
          - prometheus-node-exporter
          - curl
          - rsync
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Enable unattended security updates
      ansible.builtin.service:
        name: unattended-upgrades
        enabled: true
        state: started

    - name: Install custom Fail2ban Nginx probe-drop filter
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../files/fail2ban/nginx-probe-drop.conf"
        dest: /etc/fail2ban/filter.d/nginx-probe-drop.conf
        owner: root
        group: root
        mode: "0644"
      notify: Validate and restart fail2ban

    - name: Install Fail2ban jail configuration
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../files/fail2ban/marcelwalder.local"
        dest: /etc/fail2ban/jail.d/marcelwalder.local
        owner: root
        group: root
        mode: "0644"
      notify: Validate and restart fail2ban

    - name: Ensure Fail2ban service is enabled and running
      ansible.builtin.service:
        name: fail2ban
        enabled: true
        state: started

    - name: Ensure geoblock configuration directory exists
      ansible.builtin.file:
        path: /etc/marcelwalder
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Install sanctioned-country list configuration
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../files/geoblock/geoblock.conf"
        dest: /etc/marcelwalder/geoblock.conf
        owner: root
        group: root
        mode: "0644"
      notify: Refresh geoblock rules

    - name: Install geoblock update script (nftables + Nginx geo)
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../files/geoblock/update-geoblock.sh"
        dest: /usr/local/sbin/marcelwalder-geoblock-update
        owner: root
        group: root
        mode: "0755"
      notify: Refresh geoblock rules

    - name: Install geoblock, GoAccess, and Restic systemd units and timers
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../files/systemd/{{ item }}"
        dest: "/etc/systemd/system/{{ item }}"
        owner: root
        group: root
        mode: "0644"
      loop:
        - marcelwalder-geoblock.service
        - marcelwalder-geoblock-update.service
        - marcelwalder-geoblock-update.timer
        - marcelwalder-goaccess.service
        - marcelwalder-goaccess.timer
        - marcelwalder-restic-backup.service
        - marcelwalder-restic-backup.timer
      notify: Reload systemd daemon

    - name: Flush handlers before enabling geoblock services
      ansible.builtin.meta: flush_handlers

    - name: Populate initial geoblock ruleset if missing
      ansible.builtin.command: /usr/local/sbin/marcelwalder-geoblock-update
      args:
        creates: /etc/marcelwalder/geoblock.nft

    - name: Enable geoblock boot service and weekly refresh timer
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        enabled: true
        state: started
      loop:
        - marcelwalder-geoblock.service
        - marcelwalder-geoblock-update.timer

    - name: Configure prometheus-node-exporter to bind localhost only
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../files/monitoring/prometheus-node-exporter.default"
        dest: /etc/default/prometheus-node-exporter
        owner: root
        group: root
        mode: "0644"
      notify: Restart node_exporter

    - name: Ensure prometheus-node-exporter is enabled and running
      ansible.builtin.systemd_service:
        name: prometheus-node-exporter
        enabled: true
        state: started

    - name: Ensure Docker daemon configuration directory exists
      ansible.builtin.file:
        path: /etc/docker
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Configure Docker daemon JSON log rotation
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../files/monitoring/docker-daemon.json"
        dest: /etc/docker/daemon.json
        owner: root
        group: root
        mode: "0644"
      register: docker_daemon_cfg

    - name: Restart Docker daemon to apply new log rotation defaults
      ansible.builtin.systemd_service:
        name: docker
        state: restarted
      when: docker_daemon_cfg.changed

    - name: Ensure existing mailserver and snappymail stacks adopt log rotation once
      ansible.builtin.shell: |
        set -euo pipefail
        for stack in mailserver snappymail; do
          dir="/opt/${stack}"
          if [ -f "${dir}/docker-compose.yml" ] && docker inspect "$stack" >/dev/null 2>&1; then
            cfg="$(docker inspect --format '{% raw %}{{json .HostConfig.LogConfig.Config}}{% endraw %}' "$stack")"
            if [ "$cfg" = "{}" ] || [ "$cfg" = "null" ]; then
              docker compose -f "${dir}/docker-compose.yml" up -d --force-recreate
            fi
          fi
        done
      args:
        executable: /bin/bash
      changed_when: false

    - name: Ensure Uptime Kuma directories exist
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        owner: root
        group: root
        mode: "{{ item.mode }}"
      loop:
        - { path: /opt/uptime-kuma, mode: "0755" }
        - { path: /opt/uptime-kuma/data, mode: "0700" }

    - name: Install Uptime Kuma Docker Compose manifest
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../files/monitoring/uptime-kuma-compose.yml"
        dest: /opt/uptime-kuma/compose.yml
        owner: root
        group: root
        mode: "0644"
      register: uptime_kuma_compose

    - name: Back up data and stop Uptime Kuma before image upgrade
      ansible.builtin.shell: |
        install -d -m 0700 /var/backups
        tar -czf /var/backups/uptime-kuma-pre-upgrade.tar.gz -C /opt/uptime-kuma data
        docker compose -f /opt/uptime-kuma/compose.yml down
        docker compose -f /opt/uptime-kuma/compose.yml pull
      args:
        executable: /bin/bash
      when: uptime_kuma_compose.changed

    - name: Ensure Uptime Kuma container is running
      ansible.builtin.command: docker compose -f /opt/uptime-kuma/compose.yml up -d --remove-orphans
      register: uptime_kuma_up
      changed_when: >-
        'Started' in uptime_kuma_up.stderr
        or 'Created' in uptime_kuma_up.stderr
        or 'Recreated' in uptime_kuma_up.stderr

    - name: Wait for Uptime Kuma HTTP backend on localhost:3001
      ansible.builtin.uri:
        url: http://127.0.0.1:3001/
        status_code: [200, 302]
        follow_redirects: none
      register: kuma_health
      retries: 20
      delay: 5
      until: kuma_health.status is defined and kuma_health.status in [200, 302]

    - name: Remove temporary unencrypted Uptime Kuma pre-upgrade archive
      ansible.builtin.file:
        path: /var/backups/uptime-kuma-pre-upgrade.tar.gz
        state: absent

    - name: Check whether mailserver.env exists
      ansible.builtin.stat:
        path: /opt/mailserver/mailserver.env
      register: mailserver_env

    - name: Restrict /opt/mailserver/mailserver.env permissions
      ansible.builtin.file:
        path: /opt/mailserver/mailserver.env
        owner: root
        group: root
        mode: "0600"
      when: mailserver_env.stat.exists

    - name: Check whether SnappyMail configuration exists
      ansible.builtin.stat:
        path: /opt/snappymail/volume/_data_/_default_/configs/application.ini
      register: snappymail_ini

    - name: Keep SnappyMail web admin panel disabled by default
      ansible.builtin.lineinfile:
        path: /opt/snappymail/volume/_data_/_default_/configs/application.ini
        regexp: '^\s*allow_admin_panel\s*='
        line: "allow_admin_panel = Off"
      when: snappymail_ini.stat.exists

    - name: Install GoAccess static report update script
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../files/monitoring/goaccess-update.sh"
        dest: /usr/local/sbin/marcelwalder-goaccess-update
        owner: root
        group: root
        mode: "0755"
      notify: Refresh GoAccess report

    - name: Generate initial GoAccess report if only placeholder exists
      ansible.builtin.shell: |
        if ! grep -q "goaccess" /var/www/internal/goaccess/index.html 2>/dev/null; then
            /usr/local/sbin/marcelwalder-goaccess-update
        fi
      args:
        executable: /bin/bash
      changed_when: false

    - name: Enable and start GoAccess analytics timer
      ansible.builtin.systemd_service:
        name: marcelwalder-goaccess.timer
        enabled: true
        state: started

    - name: Install Restic S3 credentials and passphrase environment file
      ansible.builtin.copy:
        content: |
          AWS_ACCESS_KEY_ID={{ oci_s3_access_key_id }}
          AWS_SECRET_ACCESS_KEY={{ oci_s3_secret_access_key }}
          AWS_DEFAULT_REGION=eu-frankfurt-1
          RESTIC_REPOSITORY=s3:https://frlsvddoxbrh.compat.objectstorage.eu-frankfurt-1.oraclecloud.com/backups-marcelwalder-prod
          RESTIC_PASSWORD={{ restic_password }}
        dest: /etc/marcelwalder/restic.env
        owner: root
        group: root
        mode: "0600"
      no_log: true

    - name: Install Restic encrypted offsite backup script
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../files/backup/restic-backup.sh"
        dest: /usr/local/sbin/marcelwalder-restic-backup
        owner: root
        group: root
        mode: "0755"

    - name: Enable and start daily Restic offsite backup timer
      ansible.builtin.systemd_service:
        name: marcelwalder-restic-backup.timer
        enabled: true
        state: started

    - name: Initialize Restic repository and run first encrypted offsite backup
      ansible.builtin.shell: /usr/local/sbin/marcelwalder-restic-backup && touch /etc/marcelwalder/.restic-bootstrapped
      args:
        executable: /bin/bash
        creates: /etc/marcelwalder/.restic-bootstrapped

    - name: Ensure WireGuard directory exists with restricted permissions
      ansible.builtin.file:
        path: /etc/wireguard
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: Generate WireGuard server keypair if missing
      ansible.builtin.shell: |
        umask 077
        wg genkey | tee /etc/wireguard/server.key | wg pubkey > /etc/wireguard/server.pub
      args:
        executable: /bin/bash
        creates: /etc/wireguard/server.key

    - name: Read WireGuard server private key
      ansible.builtin.slurp:
        src: /etc/wireguard/server.key
      register: wg_server_key_raw
      no_log: true

    - name: Configure WireGuard wg0 admin mesh interface
      ansible.builtin.copy:
        content: |
          [Interface]
          Address = 10.66.66.1/24
          ListenPort = 51820
          PrivateKey = {{ wg_server_key_raw.content | b64decode | trim }}

          [Peer]
          # Admin peer (laptop/workstation)
          PublicKey = {{ wg_client_public_key }}
          AllowedIPs = 10.66.66.2/32
        dest: /etc/wireguard/wg0.conf
        owner: root
        group: root
        mode: "0600"
      no_log: true
      notify: Restart wg-quick@wg0

    - name: Persist WireGuard UDP 51820 and wg0 rules in /etc/iptables/rules.v4
      ansible.builtin.lineinfile:
        path: /etc/iptables/rules.v4
        insertbefore: "^-A INPUT -j REJECT"
        line: "{{ item }}"
      loop:
        - "-A INPUT -p udp -m udp --dport 51820 -j ACCEPT"
        - "-A INPUT -i wg0 -s 10.66.66.0/24 -j ACCEPT"

    - name: Ensure live iptables INPUT chain permits WireGuard UDP 51820 and wg0 before REJECT
      ansible.builtin.shell: |
        changed=0
        reject_line="$(iptables -L INPUT --line-numbers | awk '/REJECT/ {print $1; exit}')"
        if ! iptables -C INPUT -p udp -m udp --dport 51820 -j ACCEPT 2>/dev/null; then
            iptables -I INPUT "${reject_line:-1}" -p udp -m udp --dport 51820 -j ACCEPT
            changed=1
        fi
        reject_line="$(iptables -L INPUT --line-numbers | awk '/REJECT/ {print $1; exit}')"
        if ! iptables -C INPUT -i wg0 -s 10.66.66.0/24 -j ACCEPT 2>/dev/null; then
            iptables -I INPUT "${reject_line:-1}" -i wg0 -s 10.66.66.0/24 -j ACCEPT
            changed=1
        fi
        exit "$((changed == 1 ? 0 : 0))"
      args:
        executable: /bin/bash
      changed_when: false

    - name: Ensure /etc/iptables directory exists
      ansible.builtin.file:
        path: /etc/iptables
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Install IPv6 iptables baseline policy
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../files/firewall/rules.v6"
        dest: /etc/iptables/rules.v6
        owner: root
        group: root
        mode: "0644"
      register: ip6tables_rules

    - name: Apply IPv6 INPUT firewall rules without flushing live Docker FORWARD chains
      ansible.builtin.shell: |
        set -euo pipefail
        ip6tables-restore --test < /etc/iptables/rules.v6
        ip6tables -F INPUT
        ip6tables -A INPUT -m state --state RELATED,ESTABLISHED -j ACCEPT
        ip6tables -A INPUT -i lo -j ACCEPT
        ip6tables -A INPUT -p ipv6-icmp -j ACCEPT
        ip6tables -A INPUT -p tcp -m multiport --dports 22,25,80,443,465,587,993 -j ACCEPT
        ip6tables -A INPUT -p udp -m udp --dport 51820 -j ACCEPT
        ip6tables -A INPUT -j REJECT --reject-with icmp6-adm-prohibited
      args:
        executable: /bin/bash
      when: ip6tables_rules.changed

    - name: Ensure WireGuard wg-quick@wg0 service is enabled and running
      ansible.builtin.systemd_service:
        name: wg-quick@wg0
        enabled: true
        state: started

    - name: Install adapted weekly automated stack patching script
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../files/maintenance/mailserver-update.sh"
        dest: /opt/mailserver-update.sh
        owner: root
        group: root
        mode: "0755"

    - name: Ensure /usr/local/bin/mailserver-update symlink exists
      ansible.builtin.file:
        src: /opt/mailserver-update.sh
        dest: /usr/local/bin/mailserver-update
        state: link

    - name: Install weekly automated patching cron schedule
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../files/maintenance/mailserver-update.cron"
        dest: /etc/cron.d/mailserver-update
        owner: root
        group: root
        mode: "0644"

    - name: Install logrotate policy for mailserver-update.log
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../files/maintenance/mailserver-update.logrotate"
        dest: /etc/logrotate.d/mailserver-update
        owner: root
        group: root
        mode: "0644"

    - name: Install hardened OpenSSH drop-in configuration
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../files/ssh/50-marcelwalder-hardening.conf"
        dest: /etc/ssh/sshd_config.d/50-marcelwalder-hardening.conf
        owner: root
        group: root
        mode: "0644"
      notify: Validate and restart sshd

    - name: Disable SSH password authentication in main sshd_config
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: "^#?PasswordAuthentication"
        line: "PasswordAuthentication no"
      notify: Validate and restart sshd

    - name: Stop and mask unused rpcbind services
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        enabled: false
        masked: true
        state: stopped
      loop:
        - rpcbind.socket
        - rpcbind.service
      failed_when: false

  handlers:
    - name: Run fail2ban config test
      listen: "Validate and restart fail2ban"
      ansible.builtin.command: fail2ban-client -t
      changed_when: false

    - name: Restart fail2ban service
      listen: "Validate and restart fail2ban"
      ansible.builtin.service:
        name: fail2ban
        state: restarted

    - name: Reload systemd daemon
      ansible.builtin.systemd_service:
        daemon_reload: true

    - name: Refresh geoblock rules
      ansible.builtin.command: /usr/local/sbin/marcelwalder-geoblock-update
      changed_when: true

    - name: Restart node_exporter
      ansible.builtin.service:
        name: prometheus-node-exporter
        state: restarted

    - name: Refresh GoAccess report
      ansible.builtin.command: /usr/local/sbin/marcelwalder-goaccess-update
      changed_when: true

    - name: Restart wg-quick@wg0
      ansible.builtin.service:
        name: wg-quick@wg0
        state: restarted

    - name: Run sshd config test
      listen: "Validate and restart sshd"
      ansible.builtin.command: sshd -t
      changed_when: false

    - name: Restart sshd service
      listen: "Validate and restart sshd"
      ansible.builtin.service:
        name: ssh
        state: restarted
