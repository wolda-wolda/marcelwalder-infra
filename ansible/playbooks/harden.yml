---
- name: Baseline hardening for newly provisioned Ubuntu OCI VMs
  hosts: "{{ target_hosts | default('none') }}"
  become: true

  tasks:
    - name: Install baseline packages and unattended upgrades
      ansible.builtin.apt:
        name:
          - unattended-upgrades
          - fail2ban
          - python3-systemd
          - nftables
          - curl
          - rsync
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Enable unattended security updates
      ansible.builtin.service:
        name: unattended-upgrades
        enabled: true
        state: started

    - name: Install custom Fail2ban Nginx probe-drop filter
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../files/fail2ban/nginx-probe-drop.conf"
        dest: /etc/fail2ban/filter.d/nginx-probe-drop.conf
        owner: root
        group: root
        mode: "0644"
      notify: Validate and restart fail2ban

    - name: Install Fail2ban jail configuration
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../files/fail2ban/marcelwalder.local"
        dest: /etc/fail2ban/jail.d/marcelwalder.local
        owner: root
        group: root
        mode: "0644"
      notify: Validate and restart fail2ban

    - name: Ensure Fail2ban service is enabled and running
      ansible.builtin.service:
        name: fail2ban
        enabled: true
        state: started

    - name: Ensure geoblock configuration directory exists
      ansible.builtin.file:
        path: /etc/marcelwalder
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Install sanctioned-country list configuration
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../files/geoblock/geoblock.conf"
        dest: /etc/marcelwalder/geoblock.conf
        owner: root
        group: root
        mode: "0644"
      notify: Refresh geoblock rules

    - name: Install geoblock update script (nftables + Nginx geo)
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../files/geoblock/update-geoblock.sh"
        dest: /usr/local/sbin/marcelwalder-geoblock-update
        owner: root
        group: root
        mode: "0755"
      notify: Refresh geoblock rules

    - name: Install geoblock systemd units and weekly timer
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../files/systemd/{{ item }}"
        dest: "/etc/systemd/system/{{ item }}"
        owner: root
        group: root
        mode: "0644"
      loop:
        - marcelwalder-geoblock.service
        - marcelwalder-geoblock-update.service
        - marcelwalder-geoblock-update.timer
      notify: Reload systemd daemon

    - name: Flush handlers before enabling geoblock services
      ansible.builtin.meta: flush_handlers

    - name: Populate initial geoblock ruleset if missing
      ansible.builtin.command: /usr/local/sbin/marcelwalder-geoblock-update
      args:
        creates: /etc/marcelwalder/geoblock.nft

    - name: Enable geoblock boot service and weekly refresh timer
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        enabled: true
        state: started
      loop:
        - marcelwalder-geoblock.service
        - marcelwalder-geoblock-update.timer

    - name: Disable SSH password authentication
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: "^#?PasswordAuthentication"
        line: "PasswordAuthentication no"
      notify: Restart sshd

  handlers:
    - name: Run fail2ban config test
      listen: "Validate and restart fail2ban"
      ansible.builtin.command: fail2ban-client -t
      changed_when: false

    - name: Restart fail2ban service
      listen: "Validate and restart fail2ban"
      ansible.builtin.service:
        name: fail2ban
        state: restarted

    - name: Reload systemd daemon
      ansible.builtin.systemd_service:
        daemon_reload: true

    - name: Refresh geoblock rules
      ansible.builtin.command: /usr/local/sbin/marcelwalder-geoblock-update
      changed_when: true

    - name: Restart sshd
      ansible.builtin.service:
        name: ssh
        state: restarted
