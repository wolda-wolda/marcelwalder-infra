---
- name: Baseline hardening for newly provisioned Ubuntu OCI VMs
  hosts: "{{ target_hosts | default('none') }}"
  become: true

  vars:
    oci_s3_access_key_id: "{{ lookup('env', 'OCI_S3_ACCESS_KEY_ID') }}"
    oci_s3_secret_access_key: "{{ lookup('env', 'OCI_S3_SECRET_ACCESS_KEY') }}"
    restic_password: "{{ lookup('env', 'RESTIC_PASSWORD') }}"
    wg_client_public_key: "{{ lookup('env', 'WG_CLIENT_PUBLIC_KEY') }}"

  pre_tasks:
    - name: Verify required backup and WireGuard environment secrets are supplied
      ansible.builtin.assert:
        that:
          - oci_s3_access_key_id | length > 0
          - oci_s3_secret_access_key | length > 0
          - restic_password | length > 0
          - wg_client_public_key | length > 0
        fail_msg: "Missing OCI_S3_*, RESTIC_PASSWORD, or WG_CLIENT_PUBLIC_KEY env vars."
        quiet: true
      no_log: true
      tags:
        - always

  roles:
    - role: base_os
      tags:
        - os
    - role: firewall
      tags:
        - firewall
    - role: ssh_wireguard
      tags:
        - ssh
        - wireguard
    - role: mail_stack
      tags:
        - mail
    - role: monitoring_backups
      tags:
        - monitoring
        - backups

  handlers:
    - name: Run fail2ban config test
      listen: "Validate and restart fail2ban"
      ansible.builtin.command: fail2ban-client -t
      changed_when: false

    - name: Restart fail2ban service
      listen: "Validate and restart fail2ban"
      ansible.builtin.service:
        name: fail2ban
        state: restarted

    - name: Reload systemd daemon
      ansible.builtin.systemd_service:
        daemon_reload: true

    - name: Restart systemd-journald
      ansible.builtin.service:
        name: systemd-journald
        state: restarted

    - name: Refresh geoblock rules
      ansible.builtin.command: /usr/local/sbin/marcelwalder-geoblock-update
      changed_when: true

    - name: Restart node_exporter
      ansible.builtin.service:
        name: prometheus-node-exporter
        state: restarted

    - name: Refresh GoAccess report
      ansible.builtin.command: /usr/local/sbin/marcelwalder-goaccess-update
      changed_when: true

    - name: Restart wg-quick@wg0
      ansible.builtin.service:
        name: wg-quick@wg0
        state: restarted

    - name: Run sshd config test
      listen: "Validate and restart sshd"
      ansible.builtin.command: sshd -t
      changed_when: false

    - name: Restart sshd service
      listen: "Validate and restart sshd"
      ansible.builtin.service:
        name: ssh
        state: restarted
