---
- name: Deploy marcelwalder.eu static CV and Nginx security headers
  hosts: web_hosts
  gather_facts: false
  tags:
    - site

  vars:
    site_src: "{{ playbook_dir | dirname | dirname }}/site/"
    site_dest: "/var/www/marcelwalder.eu"
    acme_certificates:
      - domain: marcelwalder.eu
        server_names: "marcelwalder.eu www.marcelwalder.eu"
        webroot: /var/www/marcelwalder.eu
        cert_name: marcelwalder.eu
        live_dir: marcelwalder.eu
        cert_domains:
          - marcelwalder.eu
          - www.marcelwalder.eu
        site_file: marcelwalder.eu
      - domain: mail.marcelwalder.eu
        server_names: "mail.marcelwalder.eu"
        webroot: /var/www/mail
        cert_name: mail.marcelwalder.eu-0001
        live_dir: mail.marcelwalder.eu-0001
        cert_domains:
          - mail.marcelwalder.eu
        site_file: mail
      - domain: mta-sts.marcelwalder.eu
        server_names: "mta-sts.marcelwalder.eu"
        webroot: /var/www/mta-sts
        cert_name: mta-sts.marcelwalder.eu
        live_dir: mta-sts.marcelwalder.eu
        cert_domains:
          - mta-sts.marcelwalder.eu
        site_file: mta-sts
      - domain: status.marcelwalder.eu
        server_names: "status.marcelwalder.eu"
        webroot: /var/www/certbot-status
        cert_name: status.marcelwalder.eu
        live_dir: status.marcelwalder.eu
        cert_domains:
          - status.marcelwalder.eu
        site_file: status.marcelwalder.eu

  tasks:
    - name: Ensure target web root directory exists
      become: true
      ansible.builtin.file:
        path: "{{ site_dest }}"
        state: directory
        owner: www-data
        group: www-data
        mode: "0755"

    - name: Ensure Nginx cache directory is owned by www-data
      become: true
      ansible.builtin.file:
        path: /var/cache/nginx
        state: directory
        owner: www-data
        group: www-data
        mode: "0755"

    - name: Ensure Nginx, Certbot webroot, and internal analytics directories exist
      become: true
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: "0755"
      loop:
        - /etc/nginx/modules-enabled
        - /etc/nginx/sites-available
        - /etc/nginx/sites-enabled
        - /etc/nginx/snippets
        - /etc/nginx/geo
        - /var/www/certbot-status
        - /var/www/internal/goaccess
        - /var/www/mail
        - /var/www/mta-sts/.well-known

    - name: Configure sysctl for WireGuard bind tolerance
      become: true
      ansible.builtin.copy:
        src: "{{ (playbook_dir | dirname) }}/files/systemd/99-marcelwalder-wireguard.conf"
        dest: /etc/sysctl.d/99-marcelwalder-wireguard.conf
        owner: root
        group: root
        mode: "0644"
      notify: Apply WireGuard sysctl

    - name: Install hardened main Nginx configuration
      become: true
      ansible.builtin.copy:
        src: "{{ (playbook_dir | dirname) }}/files/nginx/nginx.conf"
        dest: /etc/nginx/nginx.conf
        owner: root
        group: root
        mode: "0644"
      notify: Validate and reload nginx

    - name: Remove upstream nginx.org and stock default Nginx vhost configs and unused mail landing page
      become: true
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/nginx/conf.d/default.conf
        - /etc/nginx/sites-available/default
        - /var/www/mail/index.html
      notify: Validate and reload nginx

    - name: Ensure placeholder Nginx geo CIDR file exists before config test
      become: true
      ansible.builtin.copy:
        content: "# Placeholder populated by marcelwalder-geoblock-update\n"
        dest: /etc/nginx/geo/blocked-countries.inc
        owner: root
        group: root
        mode: "0644"
        force: false
      notify: Validate and reload nginx

    - name: Ensure placeholder internal GoAccess report exists before first timer run
      become: true
      ansible.builtin.copy:
        content: "<!doctype html><title>GoAccess</title><p>Initial analytics report pending timer run.</p>\n"
        dest: /var/www/internal/goaccess/index.html
        owner: root
        group: root
        mode: "0644"
        force: false

    - name: Install Nginx security headers snippet
      become: true
      ansible.builtin.copy:
        src: "{{ (playbook_dir | dirname) }}/files/nginx/marcelwalder-security-headers.conf"
        dest: /etc/nginx/snippets/marcelwalder-security-headers.conf
        owner: root
        group: root
        mode: "0644"
      notify: Validate and reload nginx

    - name: Install Nginx bot protection and probe filter snippet
      become: true
      ansible.builtin.copy:
        src: "{{ (playbook_dir | dirname) }}/files/nginx/marcelwalder-bot-protection.conf"
        dest: /etc/nginx/snippets/marcelwalder-bot-protection.conf
        owner: root
        group: root
        mode: "0644"
      notify: Validate and reload nginx

    - name: Install Nginx Uptime Kuma proxy snippet
      become: true
      ansible.builtin.copy:
        src: "{{ (playbook_dir | dirname) }}/files/nginx/marcelwalder-uptime-kuma-proxy.conf"
        dest: /etc/nginx/snippets/marcelwalder-uptime-kuma-proxy.conf
        owner: root
        group: root
        mode: "0644"
      notify: Validate and reload nginx

    - name: Install Nginx HTTP rate-limit and scanner map config
      become: true
      ansible.builtin.copy:
        src: "{{ (playbook_dir | dirname) }}/files/nginx/marcelwalder-rate-limit.conf"
        dest: /etc/nginx/conf.d/marcelwalder-rate-limit.conf
        owner: root
        group: root
        mode: "0644"
      notify: Validate and reload nginx

    - name: Install default catch-all Nginx virtual host config
      become: true
      ansible.builtin.copy:
        src: "{{ (playbook_dir | dirname) }}/files/nginx/00-default-catchall.conf"
        dest: /etc/nginx/sites-available/00-default-catchall
        owner: root
        group: root
        mode: "0644"
      notify: Validate and reload nginx

    - name: Ensure default catch-all Nginx site is enabled
      become: true
      ansible.builtin.file:
        src: /etc/nginx/sites-available/00-default-catchall
        dest: /etc/nginx/sites-enabled/00-default-catchall
        state: link
      notify: Validate and reload nginx

    - name: Check whether Let's Encrypt TLS certificates exist for all four domains
      become: true
      ansible.builtin.stat:
        path: "/etc/letsencrypt/live/{{ item.live_dir }}/fullchain.pem"
      loop: "{{ acme_certificates }}"
      register: acme_cert_stats

    - name: Install HTTP ACME bootstrap vhost for domains missing certificates
      become: true
      ansible.builtin.template:
        src: "{{ (playbook_dir | dirname) }}/files/nginx/acme-bootstrap.conf.j2"
        dest: "/etc/nginx/sites-available/{{ item.item.site_file }}"
        owner: root
        group: root
        mode: "0644"
      loop: "{{ acme_cert_stats.results }}"
      when: not item.stat.exists

    - name: Enable HTTP ACME bootstrap vhost before webroot challenge
      become: true
      ansible.builtin.file:
        src: "/etc/nginx/sites-available/{{ item.item.site_file }}"
        dest: "/etc/nginx/sites-enabled/{{ item.item.site_file }}"
        state: link
      loop: "{{ acme_cert_stats.results }}"
      when: not item.stat.exists

    - name: Reload Nginx before ACME webroot challenge when any certificate is missing
      become: true
      ansible.builtin.shell: nginx -t && systemctl reload nginx
      when: acme_cert_stats.results | selectattr('stat.exists', 'equalto', false) | list | length > 0
      changed_when: true

    - name: Issue initial Let's Encrypt ECDSA certificates via webroot challenge
      become: true
      ansible.builtin.command: >
        certbot certonly --webroot -w {{ item.item.webroot }}
        --non-interactive --agree-tos --email info@marcelwalder.eu
        --key-type ecdsa --cert-name {{ item.item.cert_name }}
        {{ item.item.cert_domains | map('regex_replace', '^', '-d ') | join(' ') }}
      loop: "{{ acme_cert_stats.results }}"
      when: not item.stat.exists
      changed_when: true

    - name: Ensure Certbot Nginx TLS options file exists on fresh hosts
      become: true
      ansible.builtin.copy:
        src: /usr/lib/python3/dist-packages/certbot_nginx/_internal/tls_configs/options-ssl-nginx.conf
        dest: /etc/letsencrypt/options-ssl-nginx.conf
        remote_src: true
        owner: root
        group: root
        mode: "0644"
        force: false
      failed_when: false

    - name: Generate Diffie-Hellman parameters if absent on fresh hosts
      become: true
      ansible.builtin.command: openssl dhparam -out /etc/letsencrypt/ssl-dhparams.pem 2048
      args:
        creates: /etc/letsencrypt/ssl-dhparams.pem

    - name: Install marcelwalder.eu Nginx virtual host config
      become: true
      ansible.builtin.copy:
        src: "{{ (playbook_dir | dirname) }}/files/nginx/marcelwalder.eu.conf"
        dest: /etc/nginx/sites-available/marcelwalder.eu
        owner: root
        group: root
        mode: "0644"
      notify: Validate and reload nginx

    - name: Ensure marcelwalder.eu Nginx site is enabled
      become: true
      ansible.builtin.file:
        src: /etc/nginx/sites-available/marcelwalder.eu
        dest: /etc/nginx/sites-enabled/marcelwalder.eu
        state: link
      notify: Validate and reload nginx

    - name: Install status.marcelwalder.eu Nginx reverse-proxy virtual host config
      become: true
      ansible.builtin.copy:
        src: "{{ (playbook_dir | dirname) }}/files/nginx/status.marcelwalder.eu.conf"
        dest: /etc/nginx/sites-available/status.marcelwalder.eu
        owner: root
        group: root
        mode: "0644"
      notify: Validate and reload nginx

    - name: Ensure status.marcelwalder.eu Nginx site is enabled
      become: true
      ansible.builtin.file:
        src: /etc/nginx/sites-available/status.marcelwalder.eu
        dest: /etc/nginx/sites-enabled/status.marcelwalder.eu
        state: link
      notify: Validate and reload nginx

    - name: Install mail.marcelwalder.eu Nginx reverse-proxy virtual host config
      become: true
      ansible.builtin.copy:
        src: "{{ (playbook_dir | dirname) }}/files/nginx/mail.marcelwalder.eu.conf"
        dest: /etc/nginx/sites-available/mail
        owner: root
        group: root
        mode: "0644"
      notify: Validate and reload nginx

    - name: Ensure mail.marcelwalder.eu Nginx site is enabled
      become: true
      ansible.builtin.file:
        src: /etc/nginx/sites-available/mail
        dest: /etc/nginx/sites-enabled/mail
        state: link
      notify: Validate and reload nginx

    - name: Deploy BIMI SVG avatar concepts to /var/www/mail
      become: true
      ansible.builtin.copy:
        src: "{{ (playbook_dir | dirname) }}/files/web/bimi/{{ item }}"
        dest: "/var/www/mail/{{ item }}"
        owner: root
        group: root
        mode: "0644"
      loop:
        - concept1.svg
        - concept2.svg
        - concept3.svg

    - name: Seed default BIMI avatar.svg if not already present
      become: true
      ansible.builtin.copy:
        src: "{{ (playbook_dir | dirname) }}/files/web/bimi/concept1.svg"
        dest: /var/www/mail/avatar.svg
        owner: root
        group: root
        mode: "0644"
        force: false

    - name: Deploy MTA-STS policy file
      become: true
      ansible.builtin.copy:
        src: "{{ (playbook_dir | dirname) }}/files/web/mta-sts.txt"
        dest: /var/www/mta-sts/.well-known/mta-sts.txt
        owner: root
        group: root
        mode: "0644"

    - name: Install mta-sts.marcelwalder.eu Nginx virtual host config
      become: true
      ansible.builtin.copy:
        src: "{{ (playbook_dir | dirname) }}/files/nginx/mta-sts.marcelwalder.eu.conf"
        dest: /etc/nginx/sites-available/mta-sts
        owner: root
        group: root
        mode: "0644"
      notify: Validate and reload nginx

    - name: Ensure mta-sts.marcelwalder.eu Nginx site is enabled
      become: true
      ansible.builtin.file:
        src: /etc/nginx/sites-available/mta-sts
        dest: /etc/nginx/sites-enabled/mta-sts
        state: link
      notify: Validate and reload nginx

    - name: Install internal-only GoAccess & node_exporter Nginx vhost
      become: true
      ansible.builtin.copy:
        src: "{{ (playbook_dir | dirname) }}/files/nginx/marcelwalder-internal-admin.conf"
        dest: /etc/nginx/sites-available/marcelwalder-internal-admin
        owner: root
        group: root
        mode: "0644"
      notify: Validate and reload nginx

    - name: Ensure internal admin Nginx site is enabled
      become: true
      ansible.builtin.file:
        src: /etc/nginx/sites-available/marcelwalder-internal-admin
        dest: /etc/nginx/sites-enabled/marcelwalder-internal-admin
        state: link
      notify: Validate and reload nginx

    - name: Sync static site bundle to web root
      ansible.posix.synchronize:
        src: "{{ site_src }}"
        dest: "{{ site_dest }}/"
        delete: true
        recursive: true
        rsync_path: "sudo rsync"
        rsync_opts:
          - "--chown=www-data:www-data"
          - "--chmod=D755,F644"

  handlers:
    - name: Apply WireGuard sysctl
      become: true
      ansible.builtin.command: sysctl -p /etc/sysctl.d/99-marcelwalder-wireguard.conf
      changed_when: true

    - name: Run nginx config test
      listen: "Validate and reload nginx"
      become: true
      ansible.builtin.command: nginx -t
      changed_when: false

    - name: Reload nginx service
      listen: "Validate and reload nginx"
      become: true
      ansible.builtin.service:
        name: nginx
        state: reloaded
