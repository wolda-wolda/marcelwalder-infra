---
- name: Install hardened OpenSSH drop-in configuration
  ansible.builtin.copy:
    src: "{{ role_path }}/../../files/ssh/50-marcelwalder-hardening.conf"
    dest: /etc/ssh/sshd_config.d/50-marcelwalder-hardening.conf
    owner: root
    group: root
    mode: "0644"
  notify: Validate and restart sshd

- name: Disable SSH password authentication in main sshd_config
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "^#?PasswordAuthentication"
    line: "PasswordAuthentication no"
  notify: Validate and restart sshd

- name: Ensure WireGuard directory exists with restricted permissions
  ansible.builtin.file:
    path: /etc/wireguard
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Generate WireGuard server keypair if missing
  ansible.builtin.shell: |
    set -euo pipefail
    umask 077
    wg genkey | tee /etc/wireguard/server.key | wg pubkey > /etc/wireguard/server.pub
  args:
    executable: /bin/bash
    creates: /etc/wireguard/server.key

- name: Read WireGuard server private key
  ansible.builtin.slurp:
    src: /etc/wireguard/server.key
  register: wg_server_key_raw
  no_log: true

- name: Configure WireGuard wg0 admin mesh interface
  ansible.builtin.copy:
    content: |
      [Interface]
      Address = 10.66.66.1/24
      ListenPort = 51820
      PrivateKey = {{ wg_server_key_raw.content | b64decode | trim }}

      [Peer]
      # Admin peer (laptop/workstation)
      PublicKey = {{ wg_client_public_key }}
      AllowedIPs = 10.66.66.2/32
    dest: /etc/wireguard/wg0.conf
    owner: root
    group: root
    mode: "0600"
  no_log: true
  notify: Restart wg-quick@wg0

- name: Ensure WireGuard wg-quick@wg0 service is enabled and running
  ansible.builtin.systemd_service:
    name: wg-quick@wg0
    enabled: true
    state: started
