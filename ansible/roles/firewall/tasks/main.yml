---
- name: Ensure geoblock configuration directory exists
  ansible.builtin.file:
    path: /etc/marcelwalder
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install sanctioned-country list configuration
  ansible.builtin.copy:
    src: "{{ (playbook_dir | dirname) }}/files/geoblock/geoblock.conf"
    dest: /etc/marcelwalder/geoblock.conf
    owner: root
    group: root
    mode: "0644"
  notify: Refresh geoblock rules

- name: Install geoblock update script (nftables + Nginx geo)
  ansible.builtin.copy:
    src: "{{ (playbook_dir | dirname) }}/files/geoblock/update-geoblock.sh"
    dest: /usr/local/sbin/marcelwalder-geoblock-update
    owner: root
    group: root
    mode: "0755"
  notify: Refresh geoblock rules

- name: Install geoblock systemd units and weekly refresh timer
  ansible.builtin.copy:
    src: "{{ (playbook_dir | dirname) }}/files/systemd/{{ item }}"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - marcelwalder-geoblock.service
    - marcelwalder-geoblock-update.service
    - marcelwalder-geoblock-update.timer
  notify: Reload systemd daemon

- name: Flush handlers before loading geoblock ruleset
  ansible.builtin.meta: flush_handlers

- name: Populate initial geoblock ruleset if missing
  ansible.builtin.command: /usr/local/sbin/marcelwalder-geoblock-update
  args:
    creates: /etc/marcelwalder/geoblock.nft

- name: Enable geoblock boot service and weekly refresh timer
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    state: started
  loop:
    - marcelwalder-geoblock.service
    - marcelwalder-geoblock-update.timer

- name: Install native nftables host firewall policy (IPv4 + IPv6 + Oracle metadata guard)
  ansible.builtin.copy:
    src: "{{ (playbook_dir | dirname) }}/files/firewall/nftables.conf"
    dest: /etc/nftables.conf
    owner: root
    group: root
    mode: "0644"
    validate: nft -c -f %s
  register: firewall_nftables_cfg

- name: Check whether nftables table inet marcelwalder_host is loaded
  ansible.builtin.command: nft list table inet marcelwalder_host
  register: firewall_nft_host_table
  changed_when: false
  failed_when: false

- name: Apply native nftables host firewall policy
  ansible.builtin.command: nft -f /etc/nftables.conf
  when: firewall_nftables_cfg.changed or firewall_nft_host_table.rc != 0
  changed_when: true

- name: Enable and start native nftables service
  ansible.builtin.systemd_service:
    name: nftables.service
    enabled: true
    state: started

- name: Install custom Fail2ban Nginx probe-drop filter
  ansible.builtin.copy:
    src: "{{ (playbook_dir | dirname) }}/files/fail2ban/nginx-probe-drop.conf"
    dest: /etc/fail2ban/filter.d/nginx-probe-drop.conf
    owner: root
    group: root
    mode: "0644"
  notify: Validate and restart fail2ban

- name: Install Fail2ban jail configuration using native nftables
  ansible.builtin.copy:
    src: "{{ (playbook_dir | dirname) }}/files/fail2ban/marcelwalder.local"
    dest: /etc/fail2ban/jail.d/marcelwalder.local
    owner: root
    group: root
    mode: "0644"
  notify: Validate and restart fail2ban

- name: Ensure Fail2ban service is enabled and running
  ansible.builtin.service:
    name: fail2ban
    enabled: true
    state: started

- name: Stop and mask legacy netfilter-persistent / iptables-persistent services
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: false
    masked: true
    state: stopped
  loop:
    - netfilter-persistent.service
    - iptables.service
    - ip6tables.service
  failed_when: false

- name: Remove legacy /etc/iptables rule files superseded by nftables
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/iptables/rules.v4
    - /etc/iptables/rules.v6

- name: Flush legacy non-Docker iptables INPUT/OUTPUT rules after nftables activation
  ansible.builtin.shell: |
    set -euo pipefail
    changed=0
    if iptables -S INPUT | grep -q '^-A INPUT'; then
      iptables -P INPUT ACCEPT
      iptables -F INPUT
      changed=1
    fi
    if iptables -S OUTPUT | grep -q 'InstanceServices'; then
      iptables -F OUTPUT
      iptables -X InstanceServices 2>/dev/null || true
      changed=1
    fi
    if ip6tables -S INPUT | grep -q '^-A INPUT'; then
      ip6tables -P INPUT ACCEPT
      ip6tables -F INPUT
      changed=1
    fi
    [ "$changed" -eq 1 ] && echo "FLUSHED" || true
  args:
    executable: /bin/bash
  register: firewall_legacy_iptables_flush
  changed_when: "'FLUSHED' in firewall_legacy_iptables_flush.stdout"
