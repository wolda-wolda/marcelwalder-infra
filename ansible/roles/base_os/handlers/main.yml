---
- name: Remove upstream nginx.org default HTTP vhost
  ansible.builtin.file:
    path: /etc/nginx/conf.d/default.conf
    state: absent

- name: Align nginx logrotate ownership
  ansible.builtin.replace:
    path: /etc/logrotate.d/nginx
    regexp: 'create\s+\d+\s+nginx\s+adm'
    replace: 'create 640 www-data adm'
