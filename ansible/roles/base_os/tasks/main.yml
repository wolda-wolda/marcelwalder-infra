---
- name: Install baseline packages and unattended upgrades
  ansible.builtin.apt:
    name:
      - unattended-upgrades
      - ca-certificates
      - gnupg
      - fail2ban
      - python3-systemd
      - nftables
      - restic
      - goaccess
      - wireguard-tools
      - prometheus-node-exporter
      - curl
      - rsync
      - certbot
      - python3-certbot-nginx
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Install official nginx.org signing key with fingerprint verification
  ansible.builtin.shell: |
    set -euo pipefail
    tmp_key="$(mktemp)"
    trap 'rm -f "$tmp_key"' EXIT
    curl -fsSL https://nginx.org/keys/nginx_signing.key | gpg --dearmor --yes -o "$tmp_key"
    gpg --show-keys --with-colons "$tmp_key" | grep -q "573BFD6B3D8FBC641079A6ABABF5BD827BD9BF62"
    install -m 0644 -o root -g root "$tmp_key" /usr/share/keyrings/nginx-archive-keyring.gpg
  args:
    executable: /bin/bash
    creates: /usr/share/keyrings/nginx-archive-keyring.gpg

- name: Configure official nginx.org mainline APT repository
  ansible.builtin.copy:
    content: |
      deb [signed-by=/usr/share/keyrings/nginx-archive-keyring.gpg] https://nginx.org/packages/mainline/ubuntu noble nginx
    dest: /etc/apt/sources.list.d/nginx.list
    owner: root
    group: root
    mode: "0644"
  register: nginx_apt_repo

- name: Pin nginx.org nginx package above Ubuntu repo package
  ansible.builtin.copy:
    content: |
      Package: nginx
      Pin: origin nginx.org
      Pin: release o=nginx
      Pin-Priority: 900
    dest: /etc/apt/preferences.d/99nginx
    owner: root
    group: root
    mode: "0644"
  register: nginx_apt_pin

- name: Ensure Nginx is kept updated from official mainline repository
  ansible.builtin.apt:
    name: nginx
    state: latest
    update_cache: "{{ nginx_apt_repo.changed or nginx_apt_pin.changed }}"
    dpkg_options: "force-confdef,force-confold"
  register: nginx_pkg

- name: Remove upstream nginx.org default HTTP vhost if added on upgrade
  ansible.builtin.file:
    path: /etc/nginx/conf.d/default.conf
    state: absent
  when: nginx_pkg.changed

- name: Ensure Nginx cache directory and logrotate user match www-data
  ansible.builtin.file:
    path: /var/cache/nginx
    state: directory
    owner: www-data
    group: www-data
    mode: "0755"

- name: Align nginx logrotate file creation ownership with www-data
  ansible.builtin.replace:
    path: /etc/logrotate.d/nginx
    regexp: 'create\s+\d+\s+nginx\s+adm'
    replace: 'create 640 www-data adm'
  when: nginx_pkg.changed

- name: Configure unattended-upgrades schedules and security-only origins
  ansible.builtin.copy:
    src: "{{ role_path }}/../../files/apt/{{ item }}"
    dest: "/etc/apt/apt.conf.d/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - 20auto-upgrades
    - 50unattended-upgrades

- name: Enable unattended security updates and APT daily timers
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    state: started
  loop:
    - unattended-upgrades.service
    - apt-daily.timer
    - apt-daily-upgrade.timer

- name: Ensure systemd journald drop-in directory exists
  ansible.builtin.file:
    path: /etc/systemd/journald.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Configure systemd-journald disk size and retention cap
  ansible.builtin.copy:
    src: "{{ role_path }}/../../files/systemd/99-marcelwalder-journald.conf"
    dest: /etc/systemd/journald.conf.d/99-marcelwalder-journald.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart systemd-journald

- name: Stop and mask unused rpcbind services
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: false
    masked: true
    state: stopped
  loop:
    - rpcbind.socket
    - rpcbind.service
  failed_when: false
