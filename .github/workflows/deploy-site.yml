name: Deploy Static CV Site

on:
  pull_request:
    paths:
      - "site/**"
      - "ansible/**"
      - ".github/workflows/deploy-site.yml"
  push:
    branches:
      - main
    paths:
      - "site/**"
      - "ansible/**"
  workflow_dispatch:

concurrency:
  group: deploy-site-prod
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify-compliance:
    name: Verify Self-Hosted & CSP Hygiene
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Check for external asset leaks or inline scripts
        shell: bash
        run: |
          if grep -rnE "fonts\.googleapis\.com|fonts\.gstatic\.com|avatars\.githubusercontent\.com" site/; then
            echo "ERROR: External font/avatar CDN reference detected in site/"
            exit 1
          fi
          if grep -rnE "<script[^>]*>[^<]" site/index.html; then
            echo "ERROR: Inline script detected in site/index.html (violates script-src 'self')"
            exit 1
          fi
          echo "Compliance checks passed: 100% self-hosted assets and CSP-safe scripts."

  deploy:
    name: Deploy via Ansible
    needs: verify-compliance
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Ansible
        run: |
          python3 -m pip install --upgrade pip
          pip install ansible-core

      - name: Install Ansible POSIX collection
        run: ansible-galaxy collection install ansible.posix

      - name: Configure SSH key
        shell: bash
        env:
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          TARGET_HOST: ${{ secrets.MAIL_SERVER_HOST || 'marcelwalder.eu' }}
        run: |
          if [ -z "$DEPLOY_SSH_PRIVATE_KEY" ]; then
            echo "ERROR: Missing required secret DEPLOY_SSH_PRIVATE_KEY (see README.md)." >&2
            exit 1
          fi
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -t ed25519 -H "$TARGET_HOST" >> ~/.ssh/known_hosts
          echo "MAIL_SERVER_HOST=$TARGET_HOST" >> "$GITHUB_ENV"

      - name: Run Ansible site playbook
        working-directory: ansible
        env:
          ANSIBLE_HOST_KEY_CHECKING: "True"
        run: |
          ansible-playbook playbooks/site.yml --private-key ~/.ssh/id_deploy

      - name: Run Ansible host hardening playbook
        working-directory: ansible
        env:
          ANSIBLE_HOST_KEY_CHECKING: "True"
          OCI_S3_ACCESS_KEY_ID: ${{ secrets.OCI_S3_ACCESS_KEY_ID }}
          OCI_S3_SECRET_ACCESS_KEY: ${{ secrets.OCI_S3_SECRET_ACCESS_KEY }}
          RESTIC_PASSWORD: ${{ secrets.RESTIC_PASSWORD }}
          WG_CLIENT_PUBLIC_KEY: ${{ secrets.WG_CLIENT_PUBLIC_KEY }}
        run: |
          ansible-playbook playbooks/harden.yml -e target_hosts=web_hosts --private-key ~/.ssh/id_deploy

      - name: Smoke test live HTTPS endpoint, CSP header, and bot protections
        shell: bash
        run: |
          headers=$(curl -fsS -I https://marcelwalder.eu/)
          echo "$headers"
          echo "$headers" | grep -qi "^content-security-policy:"
          echo "$headers" | grep -qi "^strict-transport-security:"

          post_code=$(curl -sS -o /dev/null -w "%{http_code}" -X POST https://marcelwalder.eu/)
          echo "POST / returned HTTP $post_code"
          [ "$post_code" = "405" ]

          # Nginx returns 444 (closes connection without HTTP status; curl outputs 000) for exploit probes
          probe_code=$(curl -sS -o /dev/null -w "%{http_code}" https://marcelwalder.eu/.env || true)
          echo "GET /.env returned HTTP $probe_code"
          [ "$probe_code" = "000" ]

          scanner_code=$(curl -sS -o /dev/null -w "%{http_code}" -A "sqlmap/1.7" https://marcelwalder.eu/ || true)
          echo "Scanner UA returned HTTP $scanner_code"
          [ "$scanner_code" = "000" ]

          robots_body=$(curl -fsS https://marcelwalder.eu/robots.txt)
          echo "$robots_body" | grep -q "^User-agent: GPTBot"
          echo "$robots_body" | grep -q "^Allow: /"
          echo "Verified /robots.txt served cleanly."

          sec_body=$(curl -fsS https://marcelwalder.eu/.well-known/security.txt)
          echo "$sec_body" | grep -q "^Contact: mailto:info@marcelwalder.eu"
          echo "Verified /.well-known/security.txt served cleanly."

          status_code=$(curl -sS -o /dev/null -w "%{http_code}" https://status.marcelwalder.eu/status/prod)
          echo "GET https://status.marcelwalder.eu/status/prod returned HTTP $status_code"
          [ "$status_code" = "200" ]

          dashboard_code=$(curl -sS -o /dev/null -w "%{http_code}" https://status.marcelwalder.eu/dashboard)
          echo "GET https://status.marcelwalder.eu/dashboard returned HTTP $dashboard_code"
          [ "$dashboard_code" = "403" ]

          socket_code=$(curl -sS -o /dev/null -w "%{http_code}" "https://status.marcelwalder.eu/socket.io/?EIO=4&transport=polling")
          echo "GET https://status.marcelwalder.eu/socket.io/ returned HTTP $socket_code"
          [ "$socket_code" = "403" ]
