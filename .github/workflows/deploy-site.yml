name: Deploy Static CV Site

on:
  pull_request:
    paths:
      - "site/**"
      - "ansible/**"
      - ".github/workflows/deploy-site.yml"
      - "renovate.json"
  push:
    branches:
      - main
    paths:
      - "site/**"
      - "ansible/**"
      - ".github/workflows/deploy-site.yml"
  workflow_dispatch:

concurrency:
  group: deploy-site-prod
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify-compliance:
    name: Verify Compliance, Compose & Ansible Syntax
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check for external asset leaks or inline scripts
        shell: bash
        run: |
          if grep -rnE "fonts\.googleapis\.com|fonts\.gstatic\.com|avatars\.githubusercontent\.com" site/; then
            echo "ERROR: External font/avatar CDN reference detected in site/"
            exit 1
          fi
          if grep -rnE "<script[^>]*>[^<]" site/index.html; then
            echo "ERROR: Inline script detected in site/index.html (violates script-src 'self')"
            exit 1
          fi
          echo "Compliance checks passed: 100% self-hosted assets and CSP-safe scripts."

      - name: Validate Docker Compose manifests & immutable sha256 digest pins
        shell: bash
        run: |
          set -euo pipefail
          compose_files=(
            ansible/files/mailserver/docker-compose.yml
            ansible/files/mailserver/snappymail-compose.yml
            ansible/files/monitoring/uptime-kuma-compose.yml
          )
          for f in "${compose_files[@]}"; do
            docker compose -f "$f" config --quiet
            if ! grep -Eq '^\s*image:\s+\S+@sha256:[a-f0-9]{64}\s*$' "$f"; then
              echo "ERROR: $f must pin image by immutable @sha256:<digest>" >&2
              exit 1
            fi
          done
          echo "Compose syntax and @sha256 digest pin checks passed."

      - name: Validate Renovate JSON, Python scripts, and shell scripts
        shell: bash
        run: |
          set -euo pipefail
          python3 -m json.tool renovate.json > /dev/null
          find ansible/files -name '*.py' -exec python3 -m py_compile {} +
          find ansible/files -name '*.sh' -exec bash -n {} +
          echo "JSON, Python, and Bash syntax checks passed."

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"

      - name: Install Ansible, validate syntax, and run ansible-lint
        run: |
          python3 -m pip install --upgrade pip
          pip install -r ansible/requirements.txt
          ansible-galaxy collection install -r ansible/requirements.yml
          cd ansible
          ansible-playbook --syntax-check playbooks/site.yml
          ansible-playbook --syntax-check playbooks/harden.yml
          ansible-playbook --syntax-check playbooks/restore.yml
          ansible-lint

  deploy:
    name: Deploy via Ansible
    needs: verify-compliance
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Detect whether host hardening playbook needs to run
        id: changes
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "push" ] || [ -z "${{ github.event.before }}" ] || [[ "${{ github.event.before }}" =~ ^0+$ ]]; then
            echo "run_harden=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git cat-file -e "${{ github.event.before }}^{commit}" 2>/dev/null; then
            echo "run_harden=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed_files=$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}")
          echo "Changed files:"
          echo "$changed_files"
          if echo "$changed_files" | grep -Eq '^(ansible/(roles/|files/(apt|backup|fail2ban|firewall|geoblock|mailserver|maintenance|monitoring|ssh|systemd)/|playbooks/harden\.yml|requirements\.ya?ml|ansible\.cfg)|\.github/workflows/deploy-site\.yml$)'; then
            echo "run_harden=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_harden=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"

      - name: Install Ansible
        run: |
          python3 -m pip install --upgrade pip
          pip install -r ansible/requirements.txt

      - name: Install Ansible POSIX collection
        run: ansible-galaxy collection install -r ansible/requirements.yml

      - name: Configure SSH key
        shell: bash
        env:
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          TARGET_HOST: ${{ secrets.MAIL_SERVER_HOST || 'marcelwalder.eu' }}
        run: |
          if [ -z "$DEPLOY_SSH_PRIVATE_KEY" ]; then
            echo "ERROR: Missing required secret DEPLOY_SSH_PRIVATE_KEY (see README.md)." >&2
            exit 1
          fi
          if ! ssh-keygen -F "$TARGET_HOST" -f ansible/files/ssh/known_hosts >/dev/null 2>&1; then
            echo "ERROR: Host '$TARGET_HOST' is not pinned in ansible/files/ssh/known_hosts." >&2
            exit 1
          fi
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          cp ansible/files/ssh/known_hosts ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          echo "MAIL_SERVER_HOST=$TARGET_HOST" >> "$GITHUB_ENV"

      - name: Run Ansible site playbook
        working-directory: ansible
        env:
          ANSIBLE_HOST_KEY_CHECKING: "True"
        run: |
          ansible-playbook playbooks/site.yml --private-key ~/.ssh/id_deploy

      - name: Run Ansible host hardening playbook
        if: steps.changes.outputs.run_harden == 'true'
        working-directory: ansible
        env:
          ANSIBLE_HOST_KEY_CHECKING: "True"
          OCI_S3_ACCESS_KEY_ID: ${{ secrets.OCI_S3_ACCESS_KEY_ID }}
          OCI_S3_SECRET_ACCESS_KEY: ${{ secrets.OCI_S3_SECRET_ACCESS_KEY }}
          RESTIC_PASSWORD: ${{ secrets.RESTIC_PASSWORD }}
          WG_CLIENT_PUBLIC_KEY: ${{ secrets.WG_CLIENT_PUBLIC_KEY }}
        run: |
          ansible-playbook playbooks/harden.yml -e target_hosts=web_hosts --private-key ~/.ssh/id_deploy

      - name: Smoke test live HTTPS endpoint, CSP header, and bot protections
        shell: bash
        run: |
          headers=$(curl -fsS -I https://marcelwalder.eu/)
          echo "$headers"
          echo "$headers" | grep -qi "^content-security-policy:"
          echo "$headers" | grep -qi "^strict-transport-security:"

          post_code=$(curl -sS -o /dev/null -w "%{http_code}" -X POST https://marcelwalder.eu/)
          echo "POST / returned HTTP $post_code"
          [ "$post_code" = "405" ]

          # Nginx returns 444 (closes connection without HTTP status; curl outputs 000) for exploit probes
          probe_code=$(curl -sS -o /dev/null -w "%{http_code}" https://marcelwalder.eu/.env || true)
          echo "GET /.env returned HTTP $probe_code"
          [ "$probe_code" = "000" ]

          scanner_code=$(curl -sS -o /dev/null -w "%{http_code}" -A "sqlmap/1.7" https://marcelwalder.eu/ || true)
          echo "Scanner UA returned HTTP $scanner_code"
          [ "$scanner_code" = "000" ]

          robots_body=$(curl -fsS https://marcelwalder.eu/robots.txt)
          echo "$robots_body" | grep -q "^User-agent: GPTBot"
          echo "$robots_body" | grep -q "^Allow: /"
          echo "Verified /robots.txt served cleanly."

          sec_body=$(curl -fsS https://marcelwalder.eu/.well-known/security.txt)
          echo "$sec_body" | grep -q "^Contact: mailto:info@marcelwalder.eu"
          echo "Verified /.well-known/security.txt served cleanly."

          status_code=$(curl -sS -o /dev/null -w "%{http_code}" https://status.marcelwalder.eu/status/prod)
          echo "GET https://status.marcelwalder.eu/status/prod returned HTTP $status_code"
          [ "$status_code" = "200" ]

          dashboard_code=$(curl -sS -o /dev/null -w "%{http_code}" https://status.marcelwalder.eu/dashboard)
          echo "GET https://status.marcelwalder.eu/dashboard returned HTTP $dashboard_code"
          [ "$dashboard_code" = "403" ]

          socket_code=$(curl -sS -o /dev/null -w "%{http_code}" "https://status.marcelwalder.eu/socket.io/?EIO=4&transport=polling")
          echo "GET https://status.marcelwalder.eu/socket.io/ returned HTTP $socket_code"
          [ "$socket_code" = "403" ]

          mail_code=$(curl -sS -o /dev/null -w "%{http_code}" https://mail.marcelwalder.eu/)
          echo "GET https://mail.marcelwalder.eu/ returned HTTP $mail_code"
          [ "$mail_code" = "200" ]
          mail_headers=$(curl -fsS -I https://mail.marcelwalder.eu/)
          echo "$mail_headers" | grep -qi "^strict-transport-security:"

          mail_admin_code=$(curl -sS -o /dev/null -w "%{http_code}" "https://mail.marcelwalder.eu/?admin")
          echo "GET https://mail.marcelwalder.eu/?admin returned HTTP $mail_admin_code"
          [ "$mail_admin_code" = "403" ]

          bimi_headers=$(curl -fsS -I https://mail.marcelwalder.eu/avatar.svg)
          echo "$bimi_headers" | grep -qi "^content-security-policy:"
          echo "Verified BIMI avatar.svg served with CSP header."

          mta_code=$(curl -sS -o /dev/null -w "%{http_code}" https://mta-sts.marcelwalder.eu/.well-known/mta-sts.txt)
          echo "GET https://mta-sts.marcelwalder.eu/.well-known/mta-sts.txt returned HTTP $mta_code"
          [ "$mta_code" = "200" ]
          mta_headers=$(curl -fsS -I https://mta-sts.marcelwalder.eu/.well-known/mta-sts.txt)
          echo "$mta_headers" | grep -qi "^strict-transport-security:"

          server_ip=$(getent ahosts marcelwalder.eu | awk '{print $1; exit}')
          ip_http_code=$(curl -sS -o /dev/null -w "%{http_code}" "http://${server_ip}/" || true)
          echo "Direct IP HTTP returned HTTP $ip_http_code"
          [ "$ip_http_code" = "000" ]

          ip_https_code=$(curl -skS -o /dev/null -w "%{http_code}" "https://${server_ip}/" || true)
          echo "Direct IP HTTPS returned HTTP $ip_https_code"
          [ "$ip_https_code" = "000" ]
