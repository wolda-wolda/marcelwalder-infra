name: Infrastructure (OpenTofu)

on:
  pull_request:
    paths:
      - "infra/**"
      - ".github/workflows/infra.yml"
  push:
    branches:
      - main
    paths:
      - "infra/**"
      - ".github/workflows/infra.yml"
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

concurrency:
  group: oci-infra-prod
  cancel-in-progress: false

permissions:
  contents: read

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.OCI_S3_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.OCI_S3_SECRET_ACCESS_KEY }}
  AWS_REQUEST_CHECKSUM_CALCULATION: when_required
  AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
  TF_VAR_state_passphrase: ${{ secrets.TOFU_STATE_PASSPHRASE }}
  TF_VAR_compartment_id: ${{ secrets.OCI_COMPARTMENT_OCID }}
  OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
  OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
  OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
  OCI_REGION: eu-frankfurt-1

jobs:
  plan-prod:
    name: Plan OCI Infrastructure (prod)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2
        with:
          tofu_version: 1.13.9

      - name: Configure OCI API key and SSH public keys
        shell: bash
        env:
          OCI_PRIVATE_KEY_PEM: ${{ secrets.OCI_PRIVATE_KEY_PEM }}
          VM_SSH_AUTHORIZED_KEYS_JSON: ${{ secrets.VM_SSH_AUTHORIZED_KEYS_JSON }}
        run: |
          missing=0
          for var in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY TF_VAR_state_passphrase TF_VAR_compartment_id OCI_TENANCY_OCID OCI_USER_OCID OCI_FINGERPRINT OCI_PRIVATE_KEY_PEM VM_SSH_AUTHORIZED_KEYS_JSON; do
            if [ -z "${!var}" ]; then
              echo "ERROR: Missing required secret/env: $var (see README.md)." >&2
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1
          mkdir -p ~/.oci
          chmod 700 ~/.oci
          printf '%s\n' "$OCI_PRIVATE_KEY_PEM" > ~/.oci/oci_api_key.pem
          chmod 600 ~/.oci/oci_api_key.pem
          {
            echo "OCI_PRIVATE_KEY_PATH=${HOME}/.oci/oci_api_key.pem"
            echo "TF_VAR_ssh_authorized_keys<<__EOF__"
            printf '%s\n' "$VM_SSH_AUTHORIZED_KEYS_JSON"
            echo "__EOF__"
          } >> "$GITHUB_ENV"

      - name: Format check
        working-directory: infra
        run: tofu fmt -check -recursive

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6

      - name: Run TFLint
        working-directory: infra
        run: tflint --recursive

      - name: OpenTofu Init (prod)
        working-directory: infra/live/prod
        run: tofu init -input=false

      - name: OpenTofu Validate (prod)
        working-directory: infra/live/prod
        run: tofu validate

      - name: OpenTofu Plan (prod)
        working-directory: infra/live/prod
        shell: bash
        run: |
          set -o pipefail
          if [ "${{ github.event_name }}" = "schedule" ]; then
            set +e
            tofu plan -input=false -no-color -detailed-exitcode | tee plan.txt
            rc=$?
            set -e
            if [ "$rc" -eq 2 ]; then
              echo "::error::OpenTofu drift detected in infra/live/prod!"
              exit 2
            elif [ "$rc" -ne 0 ]; then
              exit "$rc"
            fi
          else
            tofu plan -input=false -no-color | tee plan.txt
          fi

      - name: Post Plan Summary on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const fs = require('fs');
            const rawPlan = fs.readFileSync('infra/live/prod/plan.txt', 'utf8');
            const plan = rawPlan.replace(/ocid1\.[a-z0-9._-]+/gi, '[REDACTED_OCID]');
            const truncated = plan.length > 60000 ? plan.slice(0, 60000) + '\n... (truncated)' : plan;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `### OpenTofu Plan (\`infra/live/prod\`)\n\`\`\`hcl\n${truncated}\n\`\`\``
            });

  apply-prod:
    name: Apply OCI Infrastructure (prod)
    needs: plan-prod
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && github.event_name != 'schedule'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2
        with:
          tofu_version: 1.13.9

      - name: Configure OCI API key and SSH public keys
        shell: bash
        env:
          OCI_PRIVATE_KEY_PEM: ${{ secrets.OCI_PRIVATE_KEY_PEM }}
          VM_SSH_AUTHORIZED_KEYS_JSON: ${{ secrets.VM_SSH_AUTHORIZED_KEYS_JSON }}
        run: |
          missing=0
          for var in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY TF_VAR_state_passphrase TF_VAR_compartment_id OCI_TENANCY_OCID OCI_USER_OCID OCI_FINGERPRINT OCI_PRIVATE_KEY_PEM VM_SSH_AUTHORIZED_KEYS_JSON; do
            if [ -z "${!var}" ]; then
              echo "ERROR: Missing required secret/env: $var (see README.md)." >&2
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1
          mkdir -p ~/.oci
          chmod 700 ~/.oci
          printf '%s\n' "$OCI_PRIVATE_KEY_PEM" > ~/.oci/oci_api_key.pem
          chmod 600 ~/.oci/oci_api_key.pem
          {
            echo "OCI_PRIVATE_KEY_PATH=${HOME}/.oci/oci_api_key.pem"
            echo "TF_VAR_ssh_authorized_keys<<__EOF__"
            printf '%s\n' "$VM_SSH_AUTHORIZED_KEYS_JSON"
            echo "__EOF__"
          } >> "$GITHUB_ENV"

      - name: OpenTofu Init (prod)
        working-directory: infra/live/prod
        run: tofu init -input=false

      - name: OpenTofu Apply (prod)
        working-directory: infra/live/prod
        run: tofu apply -input=false -auto-approve

  plan-dns:
    name: Plan Porkbun DNS (marcelwalder.eu)
    needs: plan-prod
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      PORKBUN_API_KEY: ${{ secrets.PORKBUN_API_KEY }}
      PORKBUN_SECRET_KEY: ${{ secrets.PORKBUN_SECRET_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2
        with:
          tofu_version: 1.13.9

      - name: Check Porkbun secrets presence
        id: check_dns
        shell: bash
        run: |
          if [ -n "$PORKBUN_API_KEY" ] && [ -n "$PORKBUN_SECRET_KEY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Porkbun secrets not set yet; skipping DNS plan."
          fi

      - name: OpenTofu Init (dns)
        if: steps.check_dns.outputs.enabled == 'true'
        working-directory: infra/live/dns
        run: tofu init -input=false

      - name: OpenTofu Validate (dns)
        if: steps.check_dns.outputs.enabled == 'true'
        working-directory: infra/live/dns
        run: tofu validate

      - name: OpenTofu Plan (dns)
        if: steps.check_dns.outputs.enabled == 'true'
        working-directory: infra/live/dns
        shell: bash
        run: |
          set -o pipefail
          if [ "${{ github.event_name }}" = "schedule" ]; then
            set +e
            tofu plan -input=false -no-color -detailed-exitcode | tee plan.txt
            rc=$?
            set -e
            if [ "$rc" -eq 2 ]; then
              echo "::error::OpenTofu drift detected in infra/live/dns!"
              exit 2
            elif [ "$rc" -ne 0 ]; then
              exit "$rc"
            fi
          else
            tofu plan -input=false -no-color | tee plan.txt
          fi

      - name: Post DNS Plan Summary on PR
        if: github.event_name == 'pull_request' && steps.check_dns.outputs.enabled == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('infra/live/dns/plan.txt', 'utf8');
            const truncated = plan.length > 60000 ? plan.slice(0, 60000) + '\n... (truncated)' : plan;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `### OpenTofu Plan (\`infra/live/dns\`)\n\`\`\`hcl\n${truncated}\n\`\`\``
            });

  apply-dns:
    name: Apply Porkbun DNS (marcelwalder.eu)
    needs: [apply-prod, plan-dns]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && github.event_name != 'schedule'
    runs-on: ubuntu-latest
    environment: production
    env:
      PORKBUN_API_KEY: ${{ secrets.PORKBUN_API_KEY }}
      PORKBUN_SECRET_KEY: ${{ secrets.PORKBUN_SECRET_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2
        with:
          tofu_version: 1.13.9

      - name: Check Porkbun secrets presence
        id: check_dns
        shell: bash
        run: |
          if [ -n "$PORKBUN_API_KEY" ] && [ -n "$PORKBUN_SECRET_KEY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Porkbun secrets not set yet; skipping DNS apply."
          fi

      - name: OpenTofu Init (dns)
        if: steps.check_dns.outputs.enabled == 'true'
        working-directory: infra/live/dns
        run: tofu init -input=false

      - name: OpenTofu Apply (dns)
        if: steps.check_dns.outputs.enabled == 'true'
        working-directory: infra/live/dns
        run: tofu apply -input=false -auto-approve
